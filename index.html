<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plata Clara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light dark}html,body{height:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Plata Clara</title>
<script src="config.js"></script>
<script>if(window.PC_CONFIG&&PC_CONFIG.SUPABASE_URL&&PC_CONFIG.SUPABASE_ANON_KEY){document.documentElement.classList.add('pc-lock');
/* Seguro: si el módulo de cuenta no carga, no dejar la app bloqueada para siempre */
window.addEventListener('load',function(){setTimeout(function(){if(!document.getElementById('pc-ov'))document.documentElement.classList.remove('pc-lock');},10000);});}</script>
<style>.pc-lock .app,.pc-lock #sheet,.pc-lock #toast{visibility:hidden}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar + content on desktop, bottom tab bar on phones. One accent (green), semantic colors per movement type. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface2:#F4F7F5; --ink:#12201A; --muted:#5A6A62; --line:#DAE2DD;
  --accent:#0E6B50; --accent-ink:#FFFFFF; --inc:#0B7A4E; --exp:#BE4129; --sav:#2860B0; --debt:#9E6309;
  --shadow:0 1px 2px rgba(18,32,26,.06),0 6px 20px rgba(18,32,26,.05);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#151F1A; --surface2:#1B2721; --ink:#E6EFE9; --muted:#96A79F; --line:#293731;
  --accent:#3FC39A; --accent-ink:#06231A; --inc:#46CB93; --exp:#F28C74; --sav:#82B2F4; --debt:#E8B65E;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#151F1A; --surface2:#1B2721; --ink:#E6EFE9; --muted:#96A79F; --line:#293731;
  --accent:#3FC39A; --accent-ink:#06231A; --inc:#46CB93; --exp:#F28C74; --sav:#82B2F4; --debt:#E8B65E;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.main{min-width:0;width:100%;max-width:1000px;margin:0 auto;
  padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:2px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:10px;
  padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:500}
.nav-btn span{max-width:100%;text-align:center;line-height:1.15;overflow-wrap:normal;hyphens:none}
@media (max-width:480px){.bottom{gap:0}.nav-btn{font-size:10px;padding:6px 0}}
@media (max-width:360px){.nav-btn{font-size:9px}.nav-btn svg{width:20px;height:20px}}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn[aria-current="page"]{color:var(--accent);font-weight:600}
.nav-btn[aria-current="page"] svg{stroke-width:2.2}

@media (min-width:860px){
  .app{grid-template-columns:230px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;height:100vh;
    padding:24px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
  .side .nav-btn{flex:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:15px;justify-content:flex-start}
  .side .nav-btn[aria-current="page"]{background:var(--surface)}
  .bottom{display:none}
  .main{padding-block:28px 48px}
  .brand-top{display:none}
}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px;padding:0 12px 14px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"S/";position:absolute;inset:0;display:grid;place-items:center;color:var(--accent-ink);font:700 11px var(--f-display);font-style:normal}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:26px;font-weight:700}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner b{font-weight:600}

.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.monthbar .label{font-family:var(--f-display);font-weight:600;font-size:17px;min-width:9.5em;text-align:center}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px;line-height:1}

.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.two{grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:17px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font:500 13px var(--f-body);color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card.stat{container-type:inline-size}
.stat .v{font-family:var(--f-display);font-size:24px;font-size:clamp(13px,calc(100cqw / (var(--len,10) * .62)),24px);font-weight:700;white-space:nowrap}
.stat .h{font-size:12.5px;color:var(--muted)}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hero .k,.stat.hero .h{color:inherit;opacity:.85}
.c-inc{color:var(--inc)}.c-exp{color:var(--exp)}.c-sav{color:var(--sav)}.c-debt{color:var(--debt)}

.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:currentColor;vertical-align:-1px}
.legend .li{color:var(--inc)}.legend .le{color:var(--exp)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 11px var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .bi{fill:var(--inc)}.chart .be{fill:var(--exp)}
.chart .sel{fill:var(--ink);font-weight:700}

.bars{display:flex;flex-direction:column;gap:12px}
.bar-row .hd{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.bar-row .hd span:last-child{color:var(--muted);text-align:right}
.track{height:9px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--accent)}
.fill.warn{background:var(--debt)}.fill.bad{background:var(--exp)}.fill.sav{background:var(--sav)}.fill.dbt{background:var(--debt)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:20px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:14px 2px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:12px 14px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .t small{color:var(--muted);font-size:13px}
.row .a{font-weight:600;white-space:nowrap;font-family:var(--f-display);font-size:16px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--exp);border:1px solid var(--exp)}
.btn.sm{padding:6px 12px;font-size:14px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;
  border-radius:28px;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
@media (min-width:860px){.fab{bottom:28px}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.item h3{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.item .meta{color:var(--muted);font-size:13.5px;margin:2px 0 12px}
.item .figs{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin:8px 0 12px}
.item .figs b{font-family:var(--f-display);font-size:17px}

.bud{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .tr{grid-column:1/-1}
.bud label{font-weight:600}
.bud small{color:var(--muted);display:block;font-weight:400}
.bud input{width:7.5em;text-align:right}

input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--muted)}
label.f>*:not(span){color:var(--ink);font-weight:400}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:block;text-align:center;padding:8px 2px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible+label{outline:2px solid var(--accent)}
.seg div{position:relative}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,14,11,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet h2{font-size:20px;margin-bottom:14px}
.sheet .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sheet .foot .grow{flex:1}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.help{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.help summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px}
.help ul{margin:0;padding:0 14px 12px 34px;color:var(--muted);font-size:14px}
.help li+li{margin-top:4px}
.tour-n{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px}
.tour p{font-size:15.5px;margin:0 0 10px}
.tour-a{list-style:none;counter-reset:st;padding:0;margin:12px 0 6px;display:grid;gap:9px}
.tour-a li{counter-increment:st;display:flex;gap:11px;align-items:flex-start;font-size:15.5px;line-height:1.4}
.tour-a li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 13px/1 var(--f-display);display:grid;place-items:center;margin-top:-1px}
.tour-a b{font-weight:600;color:var(--accent)}
.tour .foot{position:sticky;bottom:0;background:var(--surface);padding:10px 0 2px;margin-top:6px}
.dots{display:flex;gap:6px;margin:14px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1;pointer-events:auto}
.toast .undo{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;margin-left:14px;padding:0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* + de metas, etiquetas, aviso de notificaciones (interruptor) */
.icon-btn.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1;font-weight:500}
.icon-btn.plus svg{width:22px;height:22px;stroke-width:2.4}
.tag.ext{color:var(--sav)}
.fx{display:block;font-size:12px;color:var(--muted);font-weight:400}
.nt{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.nt[hidden]{display:none}
.nt .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--accent)}
.nt .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nt .tx{flex:1;min-width:0;line-height:1.3}
.nt .tx b{display:block;font-size:14.5px;font-weight:600}
.nt .tx small{display:block;color:var(--muted);font-size:12.5px}
.nt .tx small.e{color:var(--exp)}
.sw{flex:none;position:relative;width:48px;height:28px;border-radius:20px;border:1px solid var(--line);background:var(--surface2);padding:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
.sw[disabled]{opacity:.55;cursor:default}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}

.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;padding:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:60;display:flex;flex-direction:column;gap:2px}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:none;color:inherit;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.menu .mi:hover,.menu .mi:focus-visible{background:var(--surface2)}
.menu .mi svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#b-account.on{color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="top">
      <h1 id="title">Resumen</h1>
      <div class="menu-wrap">
        <button class="icon-btn" id="b-menu" data-a="menu" aria-label="Ajustes" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <div class="menu" id="menu" role="menu" hidden>
          <button type="button" class="mi" id="b-account" role="menuitem" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span id="mi-acc">Mi cuenta</span></button>
          <button type="button" class="mi" data-a="region" role="menuitem"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span id="mi-lang">Idioma</span></button>
          <button type="button" class="mi" id="b-admin" data-a="admin" role="menuitem" hidden><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span>Dar acceso</span></button>
          <button type="button" class="mi" data-a="settings" role="menuitem"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span id="mi-set">Ajustes</span></button>
        </div>
      </div>
    </header>
    <div id="banner"></div>
    <div id="notif" class="nt" hidden></div>
    <div id="view"></div>
  </main>
  <nav class="bottom" id="bottom" aria-label="Secciones"></nav>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* ================= idiomas y monedas ================= */

ll","Ingresos":"Income","Gastos":"Expenses","Ahorros":"Savings","Bienvenido a Plata Clara":"Welcome to Plata Clara","Aquí anotas lo que ganas y lo que gastas, y la app te muestra cuánto te queda. Este recorrido dura un minuto. Los datos que ves ahora son de ejemplo, para que pruebes sin miedo.":"Here you record what you earn and what you spend, and the app shows how much you have left. This tour takes a minute. The data you see now is just an example, so you can try things out freely.","Anota un movimiento":"Log a transaction","Pulsa “+ Nuevo” y elige el tipo: Ingreso (dinero que entra), Gasto (dinero que sale), Ahorro (dinero que apartas) o Deuda (pago de una cuota). Escribe el monto, la fecha y guarda.":"Tap “+ New” and choose the type: Income (money coming in), Expense (money going out), Savings (money you set aside) or Debt (an installment payment). Enter the amount and date, then save.","Para corregir algo, toca el movimiento en la lista: puedes editarlo o eliminarlo. Los atajos de arriba anotan un gasto frecuente con un solo toque.":"To fix something, tap the transaction in the list: you can edit or delete it. The shortcuts above log a frequent expense with a single tap.","Mira tu resumen":"Check your overview","Disponible es lo que te queda del mes: ingresos menos gastos, ahorro y pagos de deuda. Cambia de mes con las flechas. El gráfico compara tus últimos 6 meses.":"Available is what you have left this month: income minus expenses, savings and debt payments. Switch months with the arrows. The chart compares your last 6 months.","Ponle límite a tus gastos":"Set limits on your spending","En Presupuesto escribe cuánto quieres gastar al mes en cada categoría, por ejemplo Alimentación. La barra se pone ámbar cuando te acercas al límite y dice “Excedido” si te pasas.":"In Budget, enter how much you want to spend each month in each category, for example Food. The bar turns amber as you near the limit and says “Over budget” if you go past it.","Ahorra para una meta":"Save for a goal","Crea una meta con su monto y fecha, y pulsa “Aportar” cada vez que guardes dinero. Si ya tenías dinero ahorrado antes de usar la app, elige “Ya lo tenía ahorrado” para que no reste de tu Disponible de este mes.":"Create a goal with its amount and date, and tap “Contribute” every time you put money aside. If you already had savings before using the app, choose “I already had it saved” so it doesn’t reduce this month’s Available.","Controla tus deudas":"Keep track of your debts","Registra cada deuda con su monto total y su cuota mensual. Cada vez que pagues, pulsa “Registrar pago”: verás cuánto falta y cuántas cuotas quedan.":"Add each debt with its total amount and monthly payment. Every time you pay, tap “Log payment”: you’ll see how much is left and how many payments remain.","Tus datos":"Your data","Todo se guarda en este dispositivo y en este navegador. Si cambias de celular o borras los datos del navegador, se pierden, así que haz un respaldo en Ajustes. Cuando quieras empezar con lo tuyo, pulsa “Empezar con mis datos”.":"Everything is stored on this device and in this browser. If you change phones or clear your browser data, it is lost, so make a backup in Settings. When you want to start with your own, tap “Start with my data”.","En iPhone: abre la app en Safari, toca Compartir y elige “Agregar a pantalla de inicio”. Puedes volver a ver este recorrido con el botón ? de arriba, y cambiar el idioma o la moneda con el botón del globo.":"On iPhone: open the app in Safari, tap Share and choose “Add to Home Screen”. You can replay this tour with the ? button at the top, and change the language or currency with the globe button.","Disponible = ingresos − gastos − ahorro − pagos de deuda del mes.":"Available = income − expenses − savings − debt payments for the month.","Cambia de mes con las flechas de arriba.":"Switch months with the arrows above.","Toca “+ Nuevo” para registrar un movimiento desde aquí.":"Tap “+ New” to log a transaction from he a), Gasto (dinero que sale), Ahorro (dinero que apartas) o Deuda (pago de una cuota). Escribe el monto, la fecha y guarda.":"Toque em “+ Novo” e escolha o tipo: Receita (dinheiro que entra), Despesa (dinheiro que sai), Poupança (dinheiro que você guarda) ou Dívida (pagamento de uma parcela). Digite o valor e a data e salve.","Para corregir algo, toca el movimiento en la lista: puedes editarlo o eliminarlo. Los atajos de arriba anotan un gasto frecuente con un solo toque.":"Para corrigir algo, toque no movimento da lista: você pode editá-lo ou excluí-lo. Os atalhos acima registram uma despesa frequente com um só toque.","Mira tu resumen":"Veja seu resumo","Disponible es lo que te queda del mes: ingresos menos gastos, ahorro y pagos de deuda. Cambia de mes con las flechas. El gráfico compara tus últimos 6 meses.":"Disponível é o que sobra no mês: receitas menos despesas, poupança e pagamentos de dívida. Mude de mês com as setas. O gráfico compara seus últimos 6 meses.","Ponle límite a tus gastos":"Defina limites para seus gastos","En Presupuesto escribe cuánto quieres gastar al mes en cada categoría, por ejemplo Alimentación. La barra se pone ámbar cuando te acercas al límite y dice “Excedido” si te pasas.":"Em Orçamento, digite quanto quer gastar por mês em cada categoria, por exemplo Alimentação. A barra fica âmbar quando você se aproxima do limite e mostra “Excedido” se ultrapassar.","Ahorra para una meta":"Poupe para uma meta","Crea una meta con su monto y fecha, y pulsa “Aportar” cada vez que guardes dinero. Si ya tenías dinero ahorrado antes de usar la app, elige “Ya lo tenía ahorrado” para que no reste de tu Disponible de este mes.":"Crie uma meta com valor e data e toque em “Aportar” cada vez que guardar dinheiro. Se você já tinha dinheiro poupado antes de usar o app, escolha “Eu já tinha poupado” para que não reduza o seu Disponível deste mês.","Controla tus deudas":"Controle suas dívidas","Registra cada deuda con su monto total y su cuota mensual. Cada vez que pagues, pulsa “Registrar pago”: verás cuánto falta y cuántas cuotas quedan.":"Registre cada dívida com o valor total e a parcela mensal. Sempre que pagar, toque em “Registrar pagamento”: você verá quanto falta e quantas parcelas restam.","Tus datos":"Seus dados","Todo se guarda en este dispositivo y en este navegador. Si cambias de celular o borras los datos del navegador, se pierden, así que haz un respaldo en Ajustes. Cuando quieras empezar con lo tuyo, pulsa “Empezar con mis datos”.":"Tudo fica salvo neste dispositivo e neste navegador. Se você trocar de celular ou apagar os dados do navegador, tudo se perde, então faça um backup em Ajustes. Quando quiser começar com os seus, toque em “Começar com meus dados”.","En iPhone: abre la app en Safari, toca Compartir y elige “Agregar a pantalla de inicio”. Puedes volver a ver este recorrido con el botón ? de arriba, y cambiar el idioma o la moneda con el botón del globo.":"No iPhone: abra o app no Safari, toque em Compartilhar e escolha “Adicionar à Tela de Início”. Você pode rever este tour com o botão ? no topo e mudar o idioma ou a moeda com o botão do globo.","Disponible = ingresos − gastos − ahorro − pagos de deuda del mes.":"Disponível = receitas − despesas − poupança − pagamentos de dívida do mês.","Cambia de mes con las flechas de arriba.":"Mude de mês com as setas acima.","Toca “+ Nuevo” para registrar un movimiento desde aquí.":"Toque em “+ Novo” para registrar um movimento daqui.","Toca “+ Nuevo” para anotar un ingreso, gasto, ahorro o pago de deuda.":"Toque em “+ Novo” para registrar uma receita, despesa, poupança ou pagamento de dívida.","Toca un movimiento de la lista para editarlo o eliminarlo.":"Toque em um movimento da lista para editá-lo ou excluí-lo.","Usa los botones de arriba para ver solo un tipo de movimiento.":"Use os botões acima para ver apenas um tipo de movimento.","Los atajos de arriba anotan un gasto o ingreso frecuente con un toque, con la fecha de hoy. Puedes deshacerlo al instante.":"Os atalhos acima registram uma despesa ou receita frequente com um toque, com a data de hoje. Você pode desfazer na hora.","Escribe un límite en cada categoría y se guarda solo.":"Digite um limite em cada categoria e ele é salvo sozinho.","Déjalo vacío si no quieres limitar esa categoría.":"Deixe vazio se não quiser limitar essa categoria.","El límite vale para todos los meses; el gasto que ves es el del mes elegido.":"O limite vale para todos os meses; o gasto exibido é o do mês escolhido.","“Nueva meta”: ponle nombre, monto y fecha.":"“Nova meta”: dê um nome, valor e data.","“Aportar” suma dinero a la meta y lo anota como movimiento de ahorro.":"“Aportar” soma dinheiro à meta e registra como movimento de poupança.","“Ya tengo ahorrado” es para lo que tenías antes de usar la app.":"“Eu já tenho poupado” é para o que você tinha antes de usar o app.","“Nueva deuda”: escribe el total, lo que ya pagaste y la cuota mensual.":"“Nova dívida”: informe o total, o que já pagou e a parcela mensal.","“Registrar pago” suma a lo pagado y lo anota como movimiento.":"“Registrar pagamento” soma ao que já foi pago e registra como movimento.","Cuando una deuda llega a cero aparece como Pagada.":"Quando uma dívida chega a zero, aparece como Paga.","Si una cuota está por vencer o atrasada, te avisamos en el Resumen.":"Se uma parcela estiver para vencer ou atrasada, avisamos no Resumo.","¿Cómo funciona esta sección?":"Como funciona esta seção?","{n} día":"{n} dia","{n} días":"{n} dias","Desayuno":"Café da manhã","Pasajes":"Passagens","Pago semanal":"Pagamento semanal","Aporte para la mensualidad":"Ajuda para a mensalidade","Mensualidad del instituto":"Mensalidade da escola","Ahorro del mes":"Poupança do mês","Cuota de tarjeta":"Parcela do cartão","Cuota de préstamo":"Parcela do empréstimo","Gaseosa 2.25 L":"Refrigerante 2,25 L","Yogurt":"Iogurte","Salida con amigos":"Saída com amigos","Fondo de emergencia":"Fundo de emergência","Laptop nueva":"Notebook novo","Tarjeta de crédito":"Cartão aisissez le montant et la date, puis enregistrez.","Para corregir algo, toca el movimiento en la lista: puedes editarlo o eliminarlo. Los atajos de arriba anotan un gasto frecuente con un solo toque.":"Pour corriger, touchez l’opération dans la liste : vous pouvez la modifier ou la supprimer. Les raccourcis ci-dessus enregistrent une dépense fréquente d’une seule touche.","Mira tu resumen":"Consultez votre résumé","Disponible es lo que te queda del mes: ingresos menos gastos, ahorro y pagos de deuda. Cambia de mes con las flechas. El gráfico compara tus últimos 6 meses.":"Disponible, c’est ce qu’il vous reste ce mois-ci : revenus moins dépenses, épargne et remboursements de dettes. Changez de mois avec les flèches. Le graphique compare vos 6 derniers mois.","Ponle límite a tus gastos":"Fixez des limites à vos dépenses","En Presupuesto escribe cuánto quieres gastar al mes en cada categoría, por ejemplo Alimentación. La barra se pone ámbar cuando te acercas al límite y dice “Excedido” si te pasas.":"Dans Budget, indiquez ce que vous voulez dépenser par mois dans chaque catégorie, par exemple Alimentation. La barre devient ambre à l’approche de la limite et affiche « Dépassé » si vous la franchissez.","Ahorra para una meta":"Épargnez pour un objectif","Crea una meta con su monto y fecha, y pulsa “Aportar” cada vez que guardes dinero. Si ya tenías dinero ahorrado antes de usar la app, elige “Ya lo tenía ahorrado” para que no reste de tu Disponible de este mes.":"Créez un objectif avec son montant et sa date, puis touchez « Verser » chaque fois que vous mettez de l’argent de côté. Si vous aviez déjà de l’épargne avant d’utiliser l’app, choisissez « Je l’avais déjà épargné » pour que cela ne réduise pas votre Disponible du mois.","Controla tus deudas":"Suivez vos dettes","Registra cada deuda con su monto total y su cuota mensual. Cada vez que pagues, pulsa “Registrar pago”: verás cuánto falta y cuántas cuotas quedan.":"Enregistrez chaque dette avec son montant total et son échéance mensuelle. À chaque paiement, touchez « Enregistrer un paiement » : vous verrez ce qu’il reste et combien d’échéances restent.","Tus datos":"Vos données","Todo se guarda en este dispositivo y en este navegador. Si cambias de celular o borras los datos del navegador, se pierden, así que haz un respaldo en Ajustes. Cuando quieras empezar con lo tuyo, pulsa “Empezar con mis datos”.":"Tout est enregistré sur cet appareil et dans ce navigateur. Si vous changez de téléphone ou effacez les données du navigateur, tout est perdu : faites une sauvegarde dans Réglages. Quand vous voulez commencer avec les vôtres, touchez « Commencer avec mes données ».","En iPhone: abre la app en Safari, toca Compartir y elige “Agregar a pantalla de inicio”. Puedes volver a ver este recorrido con el botón ? de arriba, y cambiar el idioma o la moneda con el botón del globo.":"Sur iPhone : ouvrez l’app dans Safari, touchez Partager et choisissez « Sur l’écran d’accueil ». Vous pouvez revoir cette visite avec le bouton ? en haut, et changer la langue ou la devise avec le bouton du globe.","Disponible = ingresos − gastos − ahorro − pagos de deuda del mes.":"Disponible = revenus − dépenses − épargne − remboursements de dettes du mois.","Cambia de mes con las flechas de arriba.":"Changez de mois avec les flèches ci-dessus.","Toca “+ Nuevo” para registrar un movimiento desde aquí.":"Touchez « + Nouveau » pour enregistrer une opération d’ici.","Toca “+ Nuevo” para anotar un ingreso, gasto, ahorro o pago de deuda.":"Touchez « + Nouveau » pour noter un revenu, une dépense, une épargne ou un remboursement.","Toca un movimiento de la lista para editarlo o eliminarlo.":"Touchez une opération de la liste pour la modifier ou la supprimer.","Usa los botones de arriba para ver solo un tipo de movimiento.":"Utilisez les boutons ci-dessus pour ne voir qu’un type d’opération.","Los atajos de arriba anotan un gasto o ingreso frecuente con un toque, con la fecha de hoy. Puedes deshacerlo al instante.":"Les raccourcis ci-dessus enregistrent une dépense ou un revenu fréquent d’une touche, à la date du jour. Vous pouvez l’annuler aussitôt.","Escribe un límite en cada categoría y se guarda solo.":"Saisissez une limite pour chaque catégorie, elle s’enregistre toute seule.","Déjalo vacío si no quieres limitar esa categoría.":"Laissez vide si vous ne voulez pas limiter cette catégorie.","El límite vale para todos los meses; el gasto que ves es el del mes elegido.":"La limite vaut pour tous les mois ; la dépense affichée est celle du mois choisi.","“Nueva meta”: ponle nombre, monto y fecha.":"« Nouvel objectif » : donnez-lui un nom, un montant et une date.","“Aportar” suma dinero a la meta y lo anota como movimiento de ahorro.":"« Verser » ajoute de l’argent à l’objectif et l’enregistre comme une opération d’épargne.","“Ya tengo ahorrado” es para lo que tenías antes de usar la app.":"« J’ai déjà épargné » sert pour ce que vous aviez avant d’utiliser l’app.","“Nueva deuda”: escribe el total, lo que ya pagaste y la cuota mensual.":"« Nouvelle dette » : saisissez le total, ce que vous avez déjà payé et l’échéance mensuelle.","“Registrar pago” suma a lo pagado y lo anota como movimiento.":"« Enregistrer un paiement » s’ajoute à ce qui est payé et l’enregistre comme opération.","Cuando una deuda llega a cero aparece como Pagada.":"Quand une dette atteint zéro, elle apparaît comme Payée.","Si una cuota está por vencer o atrasada, te avisamos en el Resumen.":"Si une échéance approche ou est en retard, nous vous le signalons dans le Résumé.","¿Cómo funciona esta sección?":"Comment fonctionne cette section ?","{n} día":"{n} jour","{n} días":"{n} jours","Desayuno":"Petit-déjeuner","Pasajes":"Transport","Pago semanal":"Paie hebdomadaire","Aporte para la mensualidad":"Aide pour les frais de scolarité","Mensualidad del instituto":"Frais de scolarité","Ahorro del mes":"Épargne du mois","Cuota de tarjeta":"Échéance de carte","Cuota de préstamo":"Mensualité du prêt","Gaseosa 2.25 L":"Soda fecha, y pulsa “Aportar” cada vez que guardes dinero. Si ya tenías dinero ahorrado antes de usar la app, elige “Ya lo tenía ahorrado” para que no reste de tu Disponible de este mes.":"Lege ein Ziel mit Betrag und Datum an und tippe auf „Einzahlen“, wenn du Geld zurücklegst. Hattest du schon vor der App Erspartes, wähle „Hatte ich schon gespart“, damit es dein Verfügbar dieses Monats nicht verringert.","Controla tus deudas":"Behalte deine Schulden im Blick","Registra cada deuda con su monto total y su cuota mensual. Cada vez que pagues, pulsa “Registrar pago”: verás cuánto falta y cuántas cuotas quedan.":"Erfasse jede Schuld mit Gesamtbetrag und Monatsrate. Tippe bei jeder Zahlung auf „Zahlung erfassen“: So siehst du, wie viel noch offen ist und wie viele Raten bleiben.","Tus datos":"Deine Daten","Todo se guarda en este dispositivo y en este navegador. Si cambias de celular o borras los datos del navegador, se pierden, así que haz un respaldo en Ajustes. Cuando quieras empezar con lo tuyo, pulsa “Empezar con mis datos”.":"Alles wird auf diesem Gerät und in diesem Browser gespeichert. Wechselst du das Handy oder löschst die Browserdaten, geht alles verloren – erstelle deshalb eine Sicherung in den Einstellungen. Wenn du mit eigenen Daten starten willst, tippe auf „Mit meinen Daten starten“.","En iPhone: abre la app en Safari, toca Compartir y elige “Agregar a pantalla de inicio”. Puedes volver a ver este recorrido con el botón ? de arriba, y cambiar el idioma o la moneda con el botón del globo.":"Auf dem iPhone: Öffne die App in Safari, tippe auf Teilen und wähle „Zum Home-Bildschirm“. Mit dem ?-Knopf oben siehst du diese Tour erneut, und mit dem Globus-Knopf änderst du Sprache oder Währung.","Disponible = ingresos − gastos − ahorro − pagos de deuda del mes.":"Verfügbar = Einnahmen − Ausgaben − Sparen − Schuldenzahlungen des Monats.","Cambia de mes con las flechas de arriba.":"Wechsle den Monat mit den Pfeilen oben.","Toca “+ Nuevo” para registrar un movimiento desde ivi quanto vuoi spendere al mese in ogni categoria, per esempio Alimentari. La barra diventa ambra quando ti avvicini al limite e mostra “Superato” se lo oltrepassi.","Ahorra para una meta":"Risparmia per un obiettivo","Crea una meta con su monto y fecha, y pulsa “Aportar” cada vez que guardes dinero. Si ya tenías dinero ahorrado antes de usar la app, elige “Ya lo tenía ahorrado” para que no reste de tu Disponible de este mes.":"Crea un obiettivo con importo e data e tocca “Versa” ogni volta che metti da parte dei soldi. Se avevi già dei risparmi prima di usare l’app, scegli “Lo avevo già risparmiato” così non riduce il tuo Disponibile di questo mese.","Controla tus deudas":"Tieni sotto controllo i debiti","Registra cada deuda con su monto total y su cuota mensual. Cada vez que pagues, pulsa “Registrar pago”: verás cuánto falta y cuántas cuotas quedan.":"Registra ogni debito con l’importo totale e la rata mensile. Ogni volta che paghi, tocca “Registra pagamento”: vedrai quanto manca e quante rate restano.","Tus datos":"I tuoi dati","Todo se guarda en este dispositivo y en este navegador. Si cambias de celular o borras los datos del navegador, se pierden, así que haz un respaldo en Ajustes. Cuando quieras empezar con lo tuyo, pulsa “Empezar con mis datos”.":"Tutto viene salvato su questo dispositivo e in questo browser. Se cambi telefono o cancelli i dati del browser, va perso: fai un backup in Impostazioni. Quando vuoi iniziare con i tuoi dati, tocca “Inizia con i miei dati”.","En iPhone: abre la app en Safari, toca Compartir y elige “Agregar a pantalla de inicio”. Puedes volver a ver este recorrido con el botón ? de arriba, y cambiar el idioma o la moneda con el botón del globo.":"Su iPhone: apri l’app in Safari, tocca Condividi e scegli “Aggiungi alla schermata Home”. Puoi rivedere questo giro con il pulsante ? in alto e cambiare lingua o valuta con il pulsante del globo.","Disponible = ingresos − gastos − ahorro − pagos de deuda del mes.":"Disponibile = entrate − spese − risparmi − pagamenti dei debiti del mese.","Cambia de mes con las flechas de arriba.":"Cambia mese con le frecce qui sopra.","Toca “+ Nuevo” para registrar un movimiento desde aquí.":"Tocca “+ Nuovo” per registrare un movimento da qui.","Toca “+ Nuevo” para anotar un ingreso, gasto, ahorro o pago de deuda.":"Tocca “+ Nuovo” per annotare un’entrata, una spesa, un risparmio o un pagamento di debito.","Toca un movimiento de la lista para editarlo o eliminarlo.":"Tocca un movimento nell’elenco per modificarlo o eliminarlo.","Usa los botones de arriba para ver solo un tipo de movimiento.":"Usa i pulsanti qui sopra per vedere un solo tipo di movimento.","Los atajos de arriba anotan un gasto o ingreso frecuente con un toque, con la fecha de hoy. Puedes deshacerlo al instante.":"Le scorciatoie qui sopra annotano una spesa o un’entrata frequente con un tocco, con la data di oggi. Puoi annullare subito.","Escribe un límite en cada categoría y se guarda solo.":"Scrivi un limite per ogni categoria e si salva da solo.","Déjalo vacío si no quieres limitar esa categoría.":"Lascialo vuoto se non vuoi limitare quella categoria.","El límite vale para todos los meses; el gasto que ves es el del mes elegido.":"Il limite vale per tutti i mesi; la spesa mostrata è quella del mese scelto.","“Nueva meta”: ponle nombre, monto y fecha.":"“Nuovo obiettivo”: dagli un nome, un importo e una data.","“Aportar” suma dinero a la meta y lo anota como movimiento de ahorro.":"“Versa” aggiunge denaro all’obiettivo e lo annota come movimento di risparmio.","“Ya tengo ahorrado” es para lo que tenías antes de usar la app.":"“Ho già risparmiato” serve per ciò che avevi prima di usare l’app.","“Nueva deuda”: escribe el total, lo que ya pagaste y la cuota mensual.":"“Nuovo debito”: scrivi il totale, quanto hai già pagato e la rata mensile.","“Registrar pago” suma a lo pagado y lo anota como movimiento.":"“Registra pagamento” si somma a quanto pagato e lo annota come movimento.","Cuando una deuda lle function curOf(c){for(var i=0;i<CUR.length;i++)if(CUR[i].c===c)return CUR[i];return CUR[0];}
function validCur(c){return CUR.some(function(x){return x.c===c;});}

function userTags(){var l=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'es'];return Array.prototype.map.call(l,String);}

function detectCC(lang){
  var l=userTags();
  for(var i=0;i<l.length;i++){var rg=(l[i].split('-')[1]||'').toUpperCase();if(!rg)continue;for(var j=0;j<CUR.length;j++)if(CUR[j].r.indexOf(rg)>=0)return CUR[j].c;}
  return {es:'PEN',en:'USD',pt:'BRL',fr:'EUR',de:'EUR',it:'EUR'}[lang]||'USD';
}

function rateUSD(c){
  if(FX&&FX.r&&FX.r[c]>0)return FX.r[c];
  return curOf(c).d/curOf('USD').d;
}
function cross(a,b){return a===b?1:rateUSD(b)/rateUSD(a);}

function mc(x){return x.cc||S.home||S.cc;}

function toBase(m){return mc(m)===S.cc?m.amount:0;}   /* solo cuenta lo que está en la moneda que estás viendo */
function stampFx(rec,cc,prev){delete rec.fx;delete rec.fxb;rec.cc=validCur(cc)?cc:((prev&&prev.cc)||S.cc);}
function migrate(d){
  if(!d)return;
  if(!validCur(d.cc))d.cc=detectCC(d.lang||LANG);
  if(!validCur(d.home)){
    d.home=d.cc;
    [d.moves,d.goals,d.debts,d.quicks].forEach(function(l){(l||[]).forEach(function(x){if(!validCur(x.cc))x.cc=d.home;delete x.fx;delete x.fxb;});});
  }
  if(!validCur(d.bcc))d.bcc=d.home;
}
function curBar(){

  [S.moves,S.goals,S.debts,S.quicks].forEach(function(l){(l||[]).forEach(function(x){set[mc(x)]=1;});});
  var list=Object.keys(set);if(list.length<2)return '';
  return '<div class="chips" role="group" aria-label="'+esc(t('Moneda'))+'">'+list.map(function(c){return '<button class="chip" data-a="cur" data-v="'+c+'" aria-pressed="'+(c===S.cc)+'">'+c+' ('+esc(curSym(c))+')</button>';}).join('')+'</div>';
}
function curSym(cc){
  try{var p=new Intl.NumberFormat(numLocFor(cc),{style:'currency',currency:cc,currencyDisplay:'narrowSymbol'}).formatToParts(1);
    for(var i=0;i<p.length;i++)if(p[i].type==='currency')return p[i].value;}catch(e){}
  return cc;
}
function decSep(){
  try{var p=new Intl.NumberFormat(numLocFor(S.cc)).formatToParts(1.1);for(var i=0;i<p.length;i++)if(p[i].type==='decimal')return p[i].value;}catch(e){}
  return '.';
}
/* Lee números escritos con coma o punto, con o sin separador de miles */
function num(v){
  var s=String(v==null?'':v).replace(/[^\d.,-]/g,'');
  if(!s)return 0;
  var neg=s.charAt(0)==='-';s=s.replace(/-/g,'');
  var lc=s.lastIndexOf(','),ld=s.lastIndexOf('.'),dec=null;
  if(lc>=0&&ld>=0)dec=lc>ld?',':'.';
  else if(lc>=0||ld>=0){
    var c=lc>=0?',':'.',cnt=s.split(c).length-1;
    if(cnt===1){var after=s.length-s.indexOf(c)-1;dec=(c===decSep())?c:(after===3?null:c);}
  }
  var out;
  if(dec){var i=s.lastIndexOf(dec);out=s.slice(0,i).replace(/[.,]/g,'')+'.'+s.slice(i+1).replace(/[.,]/g,'');}
  else out=s.replace(/[.,]/g,'');
  var n=parseFloat(out);if(!isFinite(n))return 0;return neg?-n:n;
}

/* ================= helpers ================= */
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function monthLabel(k){var p=k.split('-');return cap(new Date(+p[0],+p[1]-1,1).toLocaleDateString(dateLoc(),{month:'long',year:'numeric'}));}
function monthShort(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString(dateLoc(),{month:'short'}).replace('.','');}
function dayLabel(s){var p=s.split('-');return cap(new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(dateLoc(),{weekday:'long',day:'numeric',month:'long'}));}
function dateLong(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(dateLoc(),{day:'numeric',month:'long',year:'numeric'});}
function shiftMonth(k,d){var p=k.split('-');var x=new Date(+p[0],+p[1]-1+d,1);return x.getFullYear()+'-'+pad(x.getMonth()+1);}
function monthsBack(k,n){var o=[];for(var i=n-1;i>=0;i--)o.push(shiftMonth(k,-i));return o;}
function daysUntil(s){if(!s)return null;var p=s.split('-');var d0=new Date();d0.setHours(0,0,0,0);return Math.round((new Date(+p[0],+p[1]-1,+p[2])-d0)/86400000);}
function dias(n){return t(n===1?K('{n} día'):K('{n} días'),{n:n});}
function cname(c){return t(c);}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function sc(x){var f=curOf(S.cc).d,v=x*f;return f>=20?Math.round(v/10)*10:f>=2?Math.round(v):Math.round(v*10)/10;}
function defaultQuicks(){return [
  {id:'q1',name:t('Desayuno'),type:'Gasto',cat:'Alimentación',amount:sc(9),seed:true},
  {id:'q2',name:t('Pasajes'),type:'Gasto',cat:'Movilidad',amount:sc(12),seed:true},
  {id:'q3',name:t('Pago semanal'),type:'Ingreso',cat:'Trabajo',amount:sc(150),seed:true}];}
function seedData(){
  var now=new Date(),today=iso(now),r=rng(7),moves=[];
  function add(date,type,cat,desc,amt,extra){if(date>today)return;var m={id:uid()+moves.length,date:date,type:type,cat:cat,desc:desc,amount:amt,note:'',seed:true};if(extra)for(var k in extra)m[k]=extra[k];moves.push(m);}
  var months=monthsBack(iso(now).slice(0,7),6);
  months.forEach(function(mk){
    var p=mk.split('-'),y=+p[0],mo=+p[1],dim=new Date(y,mo,0).getDate();
    [3,10,17,24].forEach(function(d){add(mk+'-'+pad(d),'Ingreso','Trabajo',t('Pago semanal'),sc(150));});
    add(mk+'-12','Ingreso','Estudios',t('Aporte para la mensualidad'),sc(650));
    add(mk+'-12','Gasto','Estudios',t('Mensualidad del instituto'),sc(595));
    add(mk+'-14','Ahorro','',t('Ahorro del mes'),sc(60),{goalId:'g1'});
    add(mk+'-14','Ahorro','',t('Ahorro del mes'),sc(40),{goalId:'g2'});
    add(mk+'-20','Deuda','',t('Cuota de tarjeta'),sc(80),{debtId:'d1'});
    add(mk+'-05','Deuda','',t('Cuota de préstamo'),sc(100),{debtId:'d2'});
    for(var d=1;d<=dim;d++){
      var ds=mk+'-'+pad(d);
      if(r()<.55)add(ds,'Gasto','Alimentación',t('Desayuno'),sc(Math.round((7+r()*5)*10)/10));
      if(r()<.35)add(ds,'Gasto','Movilidad',t('Pasajes'),sc(12));
      if(r()<.12)add(ds,'Gasto','Alimentación',t('Gaseosa 2.25 L'),sc(9));
      if(r()<.08)add(ds,'Gasto','Personal',t('Yogurt'),sc(3.3));
      if(r()<.06)add(ds,'Gasto','Ocio',t('Salida con amigos'),sc(20+Math.round(r()*25)));
    }
  });
  var y=now.getFullYear();
  return {lang:LANG,cc:S.cc,demo:true,seedv:2,seedBudgets:true,quicks:defaultQuicks(),moves:moves,
    budgets:{'Alimentación':sc(200),'Movilidad':sc(100),'Estudios':sc(650),'Ocio':sc(60),'Personal':sc(50)},
    goals:[{id:'g1',name:t('Fondo de emergencia'),target:sc(600),initial:0,date:y+'-12-31',kind:'own',seed:true},{id:'g2',name:t('Laptop nueva'),target:sc(2500),initial:0,date:(y+1)+'-06-30',kind:'own',seed:true}],
    debts:[{id:'d1',name:t('Tarjeta de crédito'),total:sc(800),initial:0,monthly:sc(80),day:20,seed:true},{id:'d2',name:t('Préstamo personal'),total:sc(1200),initial:sc(300),monthly:sc(100),day:5,seed:true}]};
}

/* Al cambiar idioma o moneda en modo ejemplo, se rehacen solo los datos de ejemplo; lo que escribió la persona se conserva */
function reseedDemo(){
  var keep=function(a){return a.filter(function(x){return !x.seed;});};
  var f=seedData();
  S.moves=f.moves.concat(keep(S.moves));S.goals=f.goals.concat(keep(S.goals));
  S.debts=f.debts.concat(keep(S.debts));S.quicks=f.quicks.concat(keep(S.quicks));
  if(S.seedBudgets)S.budgets=f.budgets;
}

/* ================= cálculos ================= */
function inMonth(m,k){return m.date.slice(0,7)===k;}
/* Con mes (k) se ignora el ahorro que ya tenía la persona (prior); sin mes (null) se cuenta todo. */
function sum(k,type){return S.moves.reduce(function(a,m){return a+(m.type===type&&(k==null||inMonth(m,k))&&!(m.prior&&k!=null)?toBase(m):0);},0);}
function spentByCat(k){var o={};S.moves.forEach(function(m){if(m.type==='Gasto'&&(!m.prior||m.fromSav)&&inMonth(m,k))o[m.cat]=(o[m.cat]||0)+toBase(m);});return o;}
function goalSaved(g){return g.initial+S.moves.reduce(function(a,m){return a+(m.goalId===g.id&&mc(m)===mc(g)?m.amount:0);},0);}
function savOut(){return S.moves.reduce(function(a,m){return a+(m.fromSav?toBase(m):0);},0);}
function debtPaid(d){return d.initial+S.moves.reduce(function(a,m){return a+(m.debtId===d.id&&mc(m)===mc(d)?m.amount:0);},0);}
function niceMax(v){if(v<=0)return 100;var e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;var n=f<=1?1:f<=2?2:f<=4?4:f<=8?8:10;return n*e;}

function cleanId(x){return String(x==null?'':x).replace(/[^\w-]/g,'')||uid();}
function quickBar(){
  var h='<div class="chips" role="group" aria-label="'+esc(t('Atajos para anotar con un toque'))+'">';

    h+='<button class="chip" data-a="qtap" data-id="'+q.id+'"><span class="'+(q.type==='Ingreso'?'c-inc':'c-exp')+'">'+(q.type==='Ingreso'?'+':'−')+'</span> '+esc(q.name)+' <span class="num" style="color:var(--muted)">'+money(q.amount)+'</span></button>';
  });
  h+='<button class="chip" data-a="qedit">'+t(S.quicks.length?K('Editar atajos'):K('+ Crear atajo'))+'</button></div>';
  return h;
}
function dueInfo(d){
  if(!d.day)return null;
  var d0=new Date();d0.setHours(0,0,0,0);
  var key=d0.getFullYear()+'-'+pad(d0.getMonth()+1);
  var dim=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate();
  var due=new Date(d0.getFullYear(),d0.getMonth(),Math.min(d.day,dim));
  var paid=S.moves.some(function(m){return m.debtId===d.id&&m.date.slice(0,7)===key;});
  return {paid:paid,diff:Math.round((due-d0)/86400000)};
}
function debtStatusHTML(d,left){
  if(left<=0)return '';
  var i=dueInfo(d);if(!i)return '';
  var txt,cls='';
  if(i.paid){txt=t('Cuota de este mes pagada');cls='c-inc';}
  else if(i.diff<0){txt=t('Cuota atrasada hace {d}',{d:dias(-i.diff)});cls='c-exp';}
  else if(i.diff===0){txt=t('La cuota vence hoy');cls='c-debt';}
  else if(i.diff<=3){txt=t('La cuota vence en {d}',{d:dias(i.diff)});cls='c-debt';}
  else{txt=t('Próxima cuota en {d}',{d:dias(i.diff)});}
  return '<p style="margin:-6px 0 10px"><span class="tag '+cls+'" style="margin-left:0">'+txt+'</span></p>';
}
function alertsHTML(){
  var items=[];
  S.debts.forEach(function(d){
    if(d.total-debtPaid(d)<=0)return;
    var i=dueInfo(d);if(!i||i.paid)return;
    var nm=esc(d.name);
    if(i.diff<0)items.push(t('{name}: cuota atrasada hace {d}',{name:nm,d:dias(-i.diff)}));
    else if(i.diff===0)items.push(t('{name}: la cuota vence hoy',{name:nm}));
    else if(i.diff<=3)items.push(t('{name}: vence en {d}',{name:nm,d:dias(i.diff)}));
  });
  if(!items.length)return '';
  return '<button class="banner" style="width:100%;text-align:left;cursor:pointer;border-style:solid;border-color:var(--debt)" data-a="nav" data-v="deudas"><span><b>'+t('Cuotas por revisar')+'</b><br>'+items.join('<br>')+'</span><span class="btn sm alt">'+t('Ver deudas')+'</span></button>';
}

function backupText(){return JSON.stringify({app:'plata-clara',version:2,exported:iso(new Date()),data:S});}
function sanitize(raw){
  var o=raw&&raw.data?raw.data:raw;
  if(!o||!Array.isArray(o.moves))return null;
  var okDate=/^\d{4}-\d{2}-\d{2}$/;
  var moves=o.moves.filter(function(m){return m&&okDate.test(String(m.date))&&TYPES.indexOf(m.type)>=0&&isFinite(Number(m.amount));}).map(function(m){
    var useCat=m.type==='Gasto'||m.type==='Ingreso';
    var r={id:cleanId(m.id),date:m.date,type:m.type,cat:useCat?(CATS.indexOf(m.cat)>=0?m.cat:'Otro'):'',desc:String(m.desc||''),amount:Number(m.amount),note:String(m.note||'')};
    if(m.goalId)r.goalId=cleanId(m.goalId);
    if(m.debtId)r.debtId=cleanId(m.debtId);
    if(m.prior)r.prior=true;
    if(m.fromSav)r.fromSav=true;
    if(m.cc&&validCur(m.cc))r.cc=m.cc;
    return r;
  });
  var goals=(Array.isArray(o.goals)?o.goals:[]).filter(function(g){return g&&g.name;}).map(function(g){
    return {cc:validCur(g.cc)?g.cc:undefined,id:cleanId(g.id),name:String(g.name),target:Number(g.target)||0,initial:Number(g.initial)||0,date:okDate.test(String(g.date))?g.date:'',kind:g.kind==='ext'?'ext':'own',owner:g.kind==='ext'?String(g.owner||'').slice(0,60):''};});
  var debts=(Array.isArray(o.debts)?o.debts:[]).filter(function(d){return d&&d.name;}).map(function(d){
    return {cc:validCur(d.cc)?d.cc:undefined,id:cleanId(d.id),name:String(d.name),total:Number(d.total)||0,initial:Number(d.initial)||0,monthly:Number(d.monthly)||0,day:Math.min(31,Math.max(0,Math.round(Number(d.day)||0)))};});
  var budgets={};
  if(o.budgets&&typeof o.budgets==='object')CATS.forEach(function(c){var v=Number(o.budgets[c]);if(v>0)budgets[c]=v;});
  var quicks=(Array.isArray(o.quicks)?o.quicks:[]).filter(function(q){return q&&q.name&&(q.type==='Gasto'||q.type==='Ingreso')&&isFinite(Number(q.amount));}).map(function(q){
    return {cc:validCur(q.cc)?q.cc:undefined,id:cleanId(q.id),name:String(q.name),type:q.type,cat:CATS.indexOf(q.cat)>=0?q.cat:'Otro',amount:Number(q.amount)};});
  var cc=validCur(o.cc)?o.cc:(LEGACY_CUR[o.cur]||S.cc);
  var res={lang:validLang(o.lang)?o.lang:LANG,cc:cc,home:validCur(o.home)?o.home:undefined,bcc:validCur(o.bcc)?o.bcc:undefined,demo:false,seen:true,moves:moves,budgets:budgets,goals:goals,debts:debts,quicks:quicks};
  migrate(res);return res;
}
function parseBackup(text){
  var raw;try{raw=JSON.parse(text);}catch(e){toast(t('Ese texto no es un respaldo válido'));return;}
  var d=sanitize(raw);if(!d){toast(t('No encontré movimientos en ese respaldo'));return;}
  ui.sheet={kind:'restore',data:d};render();
}
function readBackup(file){var r=new FileReader();r.onload=function(){parseBackup(String(r.result));};r.onerror=function(){toast(t('No pude leer el archivo'));};r.readAsText(file);}
function downloadBackup(){

    var blob=new Blob([backupText()],{type:'application/json'});var url=URL.createObjectURL(blob);
    var a=document.createElement('a');a.href=url;a.download='plata-clara-'+iso(new Date())+'.json';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    toast(t('Descargando respaldo…'));
  }catch(e){copyBackup();}

function copyBackup(){
  var txt=backupText();
  var fallback=function(){ui.sheet={kind:'copytext',text:txt};render();};
  try{navigator.clipboard.writeText(txt).then(function(){toast(t('Respaldo copiado. Pégalo en un lugar seguro'));},fallback);}catch(e){fallback();}
}
function backupBlock(){
  return '<h3 style="font-size:16px;margin:18px 0 6px">'+t('Respaldo de tus datos')+'</h3>'
   +'<p class="note" style="margin:0 0 10px">'+t('Guarda una copia por si cambias de celular o borras los datos del navegador.')+'</p>'
   +'<div class="actions"><button class="btn alt sm" data-a="bk-down">'+t('Descargar respaldo')+'</button><button class="btn alt sm" data-a="bk-copy">'+t('Copiar respaldo')+'</button></div>'
   +'<label class="f" style="margin-top:12px"><span>'+t('Restaurar desde un archivo')+'</span><input id="r-file" type="file" accept=".json,application/json"></label>'
   +'<details style="margin-top:10px"><summary style="cursor:pointer;font-size:14px;color:var(--muted)">'+t('Restaurar pegando el texto')+'</summary>'
   +'<textarea id="r-paste" rows="4" style="margin-top:8px" placeholder="'+esc(t('Pega aquí el respaldo copiado'))+'"></textarea>'
   +'<button class="btn alt sm" style="margin-top:8px" data-a="bk-paste">'+t('Revisar y restaurar')+'</button></details>';

/* ================= vistas ================= */
function statTile(k,v,h,cls,hero){var len=String(v).replace(/<[^>]*>/g,'').length;return '<div class="card stat'+(hero?' hero':'')+'"><span class="k">'+k+'</span><span class="v num '+(cls||'')+'" style="--len:'+len+'">'+v+'</span><span class="h">'+h+'</span></div>';}

function chart(){
  var ms=monthsBack(ui.month,6),W=640,H=230,L=48,R=6,T=12,B=30,pw=W-L-R,ph=H-T-B;
  var data=ms.map(function(k){return {k:k,i:sum(k,'Ingreso'),e:sum(k,'Gasto')};});
  var mx=niceMax(Math.max.apply(null,data.map(function(d){return Math.max(d.i,d.e);})));
  var nl=numLocFor(S.cc),ax;
  try{var cf=new Intl.NumberFormat(nl,{notation:'compact',maximumFractionDigits:1});ax=function(v){return cf.format(v);};}catch(e){ax=function(v){return Math.round(v).toLocaleString(nl);};}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t('Ingresos y gastos de los últimos 6 meses'))+'">';
  for(var g=0;g<=4;g++){var y=T+ph-ph*g/4;s+='<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+ax(mx*g/4)+'</text>';}
  var gw=pw/6,bw=gw*.27;
  data.forEach(function(d,i){
    var cx=L+gw*i+gw/2,hi=d.i/mx*ph,he=d.e/mx*ph;
    s+='<rect class="bi" x="'+(cx-bw-2)+'" y="'+(T+ph-hi)+'" width="'+bw+'" height="'+Math.max(hi,0)+'" rx="3"><title>'+t('Ingresos')+' '+monthShort(d.k)+': '+money(d.i)+'</title></rect>';
    s+='<rect class="be" x="'+(cx+2)+'" y="'+(T+ph-he)+'" width="'+bw+'" height="'+Math.max(he,0)+'" rx="3"><title>'+t('Gastos')+' '+monthShort(d.k)+': '+money(d.e)+'</title></rect>';
    s+='<text class="'+(d.k===ui.month?'sel':'')+'" x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+monthShort(d.k)+'</text>';
  });
  return s+'</svg>';
}

function budgetRows(k,onlyBudgeted){
  var sp=spentByCat(k),out='';
  CATS.forEach(function(c){
    var lim=S.budgets[c];if(onlyBudgeted&&!lim)return;
    var used=sp[c]||0,pct=lim?used/lim*100:0,cls=pct>=100?'bad':pct>=80?'warn':'';
    out+='<div class="bar-row"><div class="hd"><span>'+cname(c)+(pct>=100?'<span class="tag c-exp">'+t('Excedido')+'</span>':pct>=80?'<span class="tag c-debt">'+t('Cerca del límite')+'</span>':'')+'</span><span class="num">'+t('{a} de {b}',{a:money(used),b:money(lim)})+'</span></div><div class="track"><div class="fill '+cls+'" style="width:'+Math.min(pct,100)+'%"></div></div></div>';
  });
  return out;
}

function vResumen(){
  var k=ui.month,inc=sum(k,'Ingreso'),gas=sum(k,'Gasto'),ah=sum(k,'Ahorro'),de=sum(k,'Deuda'),libre=inc-gas-ah-de;
  var h=alertsHTML()+quickBar()+monthBar();
  h+='<div class="grid stats">'
    +statTile(t('Disponible'),money(libre),t('Después de gastos, ahorro y deudas'),libre<0?'c-exp':'',true)
    +statTile(t('Disponible con ahorros'),money(libre+sum(null,'Ahorro')-savOut()),t('Disponible del mes + lo que tienes ahorrado'),(libre+sum(null,'Ahorro')-savOut())<0?'c-exp':'c-sav')
    +statTile(t('Ingresos'),money(inc),t('Lo que entró este mes'),'c-inc')
    +statTile(t('Gastos'),money(gas),inc?t('{p}% de tus ingresos',{p:Math.round(gas/inc*100)}):t('Sin ingresos aún'),'c-exp')
    +statTile(t('Ahorrado este mes'),money(ah),t('Total acumulado: {v}',{v:money(sum(null,'Ahorro')-savOut())}),'c-sav')+'</div>';
  h+='<div class="grid two" style="margin-top:12px"><section class="card"><h2>'+t('Ingresos y gastos')+' <small>'+t('últimos 6 meses')+'</small></h2><div class="legend"><span class="li">'+t('Ingresos')+'</span><span class="le">'+t('Gastos')+'</span></div>'+chart()+'</section>';
  var sp=spentByCat(k),cats=Object.keys(sp).sort(function(a,b){return sp[b]-sp[a];}),top=cats.length?sp[cats[0]]:1;
  h+='<section class="card"><h2>'+t('Gasto por categoría')+' <small>'+monthLabel(k)+'</small></h2>';
  if(!cats.length)h+='<p class="empty">'+t('Aún no hay gastos este mes.')+'</p>';
  else{h+='<div class="bars">';cats.forEach(function(c){h+='<div class="bar-row"><div class="hd"><span>'+cname(c)+'</span><span class="num">'+money(sp[c])+' · '+Math.round(sp[c]/gas*100)+'%</span></div><div class="track"><div class="fill" style="width:'+(sp[c]/top*100)+'%"></div></div></div>';});h+='</div>';}
  h+='</section></div>';
  var hasB=S.cc===BC()&&CATS.some(function(c){return S.budgets[c];});
  h+='<div class="grid two" style="margin-top:12px"><section class="card"><h2>'+t('Presupuesto')+' <small>'+monthLabel(k)+'</small></h2>'
    +(hasB?'<div class="bars">'+budgetRows(k,true)+'</div>':'<p class="empty">'+t('Define límites por categoría en la sección Presupuesto.')+'</p>')+'</section>';
  var recent=S.moves.filter(function(m){return mc(m)===S.cc;}).sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,5);
  h+='<section class="card"><h2>'+t('Últimos movimientos')+'</h2>'+(recent.length?'<div class="list" style="border:0;border-radius:0">'+recent.map(moveRow).join('')+'</div>':'<p class="empty">'+t('Registra tu primer movimiento con el botón “Nuevo”.')+'</p>')+'</section></div>';
  return h;
}
function monthBar(){return '<div class="monthbar"><button class="step" data-a="mprev" aria-label="'+esc(t('Mes anterior'))+'">‹</button><div class="label" aria-live="polite">'+monthLabel(ui.month)+'</div><button class="step" data-a="mnext" aria-label="'+esc(t('Mes siguiente'))+'">›</button></div>';}

function moveRow(m){
  var sign=m.type==='Ingreso'?'+':m.type==='Gasto'?'−':'';
  var sub=m.type==='Ahorro'||m.type==='Deuda'?t(TYPE_LABEL[m.type]):cname(m.cat);
  if(m.goalId){var g=S.goals.filter(function(x){return x.id===m.goalId;})[0];if(g)sub+=' · '+g.name;}
  if(m.fromSav)sub+=' · '+t('De mis ahorros');else if(m.prior)sub+=' · '+t(m.type==='Ahorro'?'Ya lo tenía ahorrado':'No afecta mi Disponible');
  var fgn=false;
  if(m.debtId){var d=S.debts.filter(function(x){return x.id===m.debtId;})[0];if(d)sub+=' · '+d.name;}
  return '<button class="row" data-a="edit" data-id="'+m.id+'"><span class="t"><b>'+esc(m.desc||t(TYPE_LABEL[m.type]))+'</b><small>'+esc(sub)+(m.note?' · '+esc(m.note):'')+'</small></span><span class="a num '+TYPE_CLASS[m.type]+'">'+sign+money(m.amount,fgn?m.cc:null)+'</span></button>';
}
function vMovs(){
  var h=quickBar()+monthBar()+'<div class="chips" role="group" aria-label="'+esc(t('Filtrar por tipo'))+'">';
  FILTERS.forEach(function(f){h+='<button class="chip" data-a="filter" data-v="'+f[0]+'" aria-pressed="'+(ui.filter===f[0])+'">'+t(f[1])+'</button>';});
  h+='</div>';
  var list=S.moves.filter(function(m){return mc(m)===S.cc&&inMonth(m,ui.month)&&(ui.filter==='Todos'||m.type===ui.filter);}).sort(function(a,b){return b.date.localeCompare(a.date);});
  if(!list.length)return h+'<div class="card"><p class="empty">'+t('No hay movimientos con este filtro. Usa “Nuevo” para registrar uno.')+'</p></div>';
  var day='',open=false;
  list.forEach(function(m){if(m.date!==day){if(open)h+='</div>';day=m.date;h+='<div class="day">'+dayLabel(day)+'</div><div class="list">';open=true;}h+=moveRow(m);});
  return h+'</div>';
}
function vPresu(){
  if(S.cc!==BC())return monthBar()+'<div class="card"><p class="empty">'+t('Los presupuestos están en {c}. Cambia a esa moneda para verlos.',{c:BC()})+'</p></div>';
  var k=ui.month,sp=spentByCat(k),tl=0,ts=0;
  CATS.forEach(function(c){if(S.budgets[c]){tl+=S.budgets[c];ts+=sp[c]||0;}});
  var h=monthBar()+'<div class="grid stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'
   +statTile(t('Presupuestado'),money(tl),t('Suma de tus límites'))
   +statTile(t('Gastado'),money(ts),t('En categorías con límite'),'c-exp')
   +statTile(ts>tl?t('Te pasaste'):t('Te queda'),money(Math.abs(tl-ts)),tl?t('{p}% usado',{p:Math.round(ts/tl*100)}):t('Aún sin límites'),ts>tl?'c-exp':'c-inc')+'</div>';
  h+='<section class="card" style="margin-top:12px"><h2>'+t('Límite por categoría')+' <small>'+t('se aplica a todos los meses')+'</small></h2>';
  CATS.forEach(function(c){
    var lim=S.budgets[c]||0,used=sp[c]||0,pct=lim?used/lim*100:0,cls=pct>=100?'bad':pct>=80?'warn':'';
    h+='<div class="bud"><label for="b-'+c+'">'+cname(c)+'<small class="num">'+t('Gastado: {v}',{v:money(used)})+(lim&&pct>=100?' · '+t('Excedido'):'')+'</small></label><input id="b-'+c+'" data-budget="'+c+'" inputmode="decimal" placeholder="'+esc(t('Sin límite'))+'" value="'+(lim||'')+'" aria-label="'+esc(t('Límite mensual para {c}',{c:cname(c)}))+'">'
      +(lim?'<div class="tr"><div class="track"><div class="fill '+cls+'" style="width:'+Math.min(pct,100)+'%"></div></div></div>':'')+'</div>';
  });
  return h+'</section>';
}
function vAhorros(){
  var tot=sum(null,'Ahorro')-savOut(),inG=S.moves.reduce(function(a,m){return a+(m.type==='Ahorro'&&m.goalId?toBase(m):0);},0);
  var h='<div class="toolbar"><div><span class="stat"><span class="k">'+t('Total ahorrado')+'</span><span class="v num c-sav" style="font-size:28px">'+money(tot)+'</span></span></div><button class="btn" data-a="save-new">'+t('Nuevo ahorro')+'</button></div>';
  h+='<div class="grid stats" style="grid-template-columns:repeat(2,minmax(0,1fr))">'
    +statTile(t('En metas'),money(inG),t('Aportes a tus metas'),'c-sav')
    +statTile(t('Ahorro general'),money(tot-inG),t('Sin una meta asignada'),'c-sav')+'</div>';
  var list=S.moves.filter(function(m){return m.type==='Ahorro'&&mc(m)===S.cc;}).sort(function(a,b){return b.date.localeCompare(a.date);});
  if(!list.length)return h+'<div class="card" style="margin-top:12px"><p class="empty">'+t('Aún no has anotado ahorros. Usa “Nuevo ahorro” para empezar.')+'</p></div>';
  h+='<div class="day">'+t('Tus ahorros')+'</div><div class="list">'+list.slice(0,60).map(moveRow).join('')+'</div>';
  if(list.length>60)h+='<p class="note">'+t('Mostrando los 60 más recientes.')+'</p>';
  return h;
}
function vMetas(){
  var GS=S.goals.filter(function(g){return mc(g)===S.cc;}),hasExt=GS.some(function(g){return g.kind==='ext';}),f=hasExt?ui.gfilter:'all';
  var tot=GS.reduce(function(a,g){return a+goalSaved(g);},0);
  var h='<div class="toolbar"><div><span class="stat"><span class="k">'+t('Ahorrado en metas')+'</span><span class="v num c-sav" style="font-size:28px">'+money(tot)+'</span></span></div>'
    +'<button class="icon-btn plus" data-a="goal-new" aria-label="'+esc(t('Nueva meta'))+'" title="'+esc(t('Nueva meta'))+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>';
  if(hasExt){
    h+='<div class="chips" role="group" aria-label="'+esc(t('Filtrar metas'))+'">';
    [['all',K('Todas')],['own',K('Personales')],['ext',K('Externas')]].forEach(function(x){h+='<button class="chip" data-a="gfilter" data-v="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+t(x[1])+'</button>';});
    h+='</div>';
  }
  if(!GS.length)return h+'<div class="card"><p class="empty">'+t('Toca + para crear una meta (viaje, fondo de emergencia, compra) y ve cuánto te falta.')+'</p></div>';
  var gs=GS.filter(function(g){return f==='all'||(f==='ext'?g.kind==='ext':g.kind!=='ext');});
  if(!gs.length)return h+'<div class="card"><p class="empty">'+t('No hay metas en este filtro.')+'</p></div>';
  h+='<div class="cards">';
  gs.forEach(function(g){
    var sv=goalSaved(g),pct=Math.min(100,g.target?sv/g.target*100:0),dl=daysUntil(g.date),ext=g.kind==='ext';
    var meta=g.date?t('Para el {date}',{date:dateLong(g.date)})+(dl!=null?' · '+(dl<0?t('venció hace {d}',{d:dias(-dl)}):dias(dl)):''):t('Sin fecha');
    if(ext&&g.owner)meta=t('Meta de {name}',{name:esc(g.owner)})+' · '+meta;
    h+='<article class="card item"><h3>'+esc(g.name)+(ext?'<span class="tag ext">'+t('Externa')+'</span>':'')+'</h3><p class="meta">'+meta+'</p>'
     +'<div class="track"><div class="fill sav" style="width:'+pct+'%"></div></div><div class="figs"><span>'+t('Ahorrado')+'<br><b class="num c-sav">'+money(sv)+'</b></span><span style="text-align:right">'+t('Meta')+'<br><b class="num">'+money(g.target)+'</b></span></div>'
     +'<div class="actions"><button class="btn sm" data-a="contrib" data-id="'+g.id+'">'+t('Aportar')+'</button><button class="btn sm alt" data-a="goal-edit" data-id="'+g.id+'">'+t('Editar')+'</button><span class="num" style="align-self:center;color:var(--muted);font-size:13px">'+Math.round(pct)+'%</span></div></article>';
  });
  return h+'</div>';
}
function vDeudas(){
  var DS=S.debts.filter(function(d){return mc(d)===S.cc;}),rem=0;DS.forEach(function(d){rem+=Math.max(0,d.total-debtPaid(d));});
  var h='<div class="toolbar"><div><span class="stat"><span class="k">'+t('Por pagar')+'</span><span class="v num c-debt" style="font-size:28px">'+money(rem)+'</span></span></div><button class="btn alt" data-a="debt-new">'+t('Nueva deuda')+'</button></div>';
  if(!DS.length)return h+'<div class="card"><p class="empty">'+t('Registra tus deudas para ver cuánto falta y no olvidar las cuotas.')+'</p></div>';
  h+='<div class="cards">';
  DS.forEach(function(d){
    var paid=debtPaid(d),left=Math.max(0,d.total-paid),pct=Math.min(100,d.total?paid/d.total*100:0);
    var months=d.monthly?Math.ceil(left/d.monthly):null,iM=dueInfo(d),paidM=!!(iM&&iM.paid),done=left===0||paidM;
    var meta=d.monthly?t('Cuota de {v}',{v:money(d.monthly)})+(d.day?' · '+t('día {d} de cada mes',{d:d.day}):''):t('Sin cuota fija');
    if(months&&left)meta+=' · '+t('faltan ~{n} cuotas',{n:months});
    h+='<article class="card item"><h3>'+esc(d.name)+(left===0?'<span class="tag c-inc">'+t('Pagada')+'</span>':paidM?'<span class="tag c-inc">'+t('Pagado')+'</span>':'')+'</h3><p class="meta">'+meta+'</p>'
     +debtStatusHTML(d,left)+'<div class="track"><div class="fill dbt" style="width:'+pct+'%"></div></div><div class="figs"><span>'+t('Pagado')+'<br><b class="num">'+money(paid)+'</b></span><span style="text-align:right">'+t('Falta')+'<br><b class="num c-debt">'+money(left)+'</b></span></div>'
     +(done?'':'<div class="actions"><button class="btn sm" data-a="pay" data-id="'+d.id+'">'+t('Registrar pago')+'</button><button class="btn sm alt" data-a="debt-edit" data-id="'+d.id+'">'+t('Editar')+'</button></div>')+'</article>';
  });
  return h+'</div>';
}

function opts(list,sel,blank){return (blank?'<option value="">'+esc(blank)+'</option>':'')+list.map(function(o){var v=typeof o==='string'?o:o.id,l=typeof o==='string'?cname(o):o.name;return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(l)+'</option>';}).join('');}
function debtOrigin(m,id){
  return '<label class="f full"><span>'+t('¿De dónde sale este pago?')+'</span><select id="'+(id||'f-origin')+'" name="origin"><option value="">'+t('De mis ingresos de este mes')+'</option><option value="ahorro"'+(m&&m.fromSav?' selected':'')+'>'+t('De mis ahorros')+'</option></select></label>';

function originSel(m,sav){

  return (type==='Gasto'?originSel(m,false):'')+'<label class="f full"><span>'+t('Categoría')+'</span><select id="f-cat" name="cat">'+opts(CATS,m.cat||'Alimentación')+'</select></label>'
    +(m.id?'':'<label class="f full" style="flex-direction:row;align-items:center;gap:8px"><input id="f-asquick" type="checkbox" name="asquick" style="width:auto"><span>'+t('Guardar como atajo para anotarlo con un toque')+'</span></label>');

function admGo(){var e=(document.getElementById('adm-e').value||'').trim(),n=(document.getElementById('adm-n').value||'').trim(),msg=document.getElementById('adm-msg');

function render(){

  var nav=NAV.map(function(n){return '<button class="nav-btn" data-a="nav" data-v="'+n[0]+'"'+(ui.view===n[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+n[2]+'</svg><span>'+t(n[1])+'</span></button>';}).join('');
  document.getElementById('side').innerHTML='<div class="brand"><i></i>Plata Clara</div>'+nav;
  var bt=document.getElementById('bottom');bt.innerHTML=nav;bt.setAttribute('aria-label',t('Secciones'));
  document.getElementById('title').textContent=t(TITLES[ui.view]);
  document.getElementById('b-menu').setAttribute('aria-label',t('Ajustes'));
  document.getElementById('mi-acc').textContent=t('Mi cuenta');document.getElementById('mi-lang').textContent=t('Idioma');document.getElementById('mi-set').textContent=t('Ajustes');
  document.getElementById('banner').innerHTML=S.demo?'<div class="banner"><span>'+t('<b>Estás viendo datos de ejemplo.</b> Pruébalos y, cuando quieras, empieza con los tuyos.')+'</span><button class="btn sm" data-a="clearall">'+t('Empezar con mis datos')+'</button></div>':'';
  var v=curBar()+{resumen:vResumen,movimientos:vMovs,presupuesto:vPresu,ahorros:vAhorros,metas:vMetas,deudas:vDeudas}[ui.view]();
  if(ui.view==='movimientos'||ui.view==='resumen')v+='<button class="btn fab" data-a="new">'+t('+ Nuevo')+'</button>';
  document.getElementById('view').innerHTML=v;
  var sh=document.getElementById('sheet');
  if(ui.sheet){sh.innerHTML=sheetHTML();var f=sh.querySelector('input:not([type=radio]),select');if(f&&!ui.sheet.noFocus)f.focus();if(ui.sheet.kind==='copytext'){var ta=sh.querySelector('textarea');if(ta){ta.focus();ta.select();}}}else sh.innerHTML='';
  try{document.dispatchEvent(new CustomEvent('pc-render'));}catch(e){}
}
function toast(msg,undoId){var el=document.getElementById('toast');el.textContent=msg;
  if(undoId){var b=document.createElement('button');b.className='undo';b.setAttribute('data-a','undo');b.setAttribute('data-id',undoId);b.textContent=t('Deshacer');el.appendChild(b);}
  el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},undoId?5000:2000);}
function closeSheet(){if(ui.sheet&&ui.sheet.kind==='tour'){if(!S.seen){S.seen=true;save();}ui.view='resumen';}ui.sheet=null;render();}

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plata Clara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);color-scheme:light dark}html,body{height:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Plata Clara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar + content on desktop, bottom tab bar on phones. One accent (green), semantic colors per movement type. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface2:#F4F7F5; --ink:#12201A; --muted:#5A6A62; --line:#DAE2DD;
  --accent:#0E6B50; --accent-ink:#FFFFFF; --inc:#0B7A4E; --exp:#BE4129; --sav:#2860B0; --debt:#9E6309;
  --shadow:0 1px 2px rgba(18,32,26,.06),0 6px 20px rgba(18,32,26,.05);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#151F1A; --surface2:#1B2721; --ink:#E6EFE9; --muted:#96A79F; --line:#293731;
  --accent:#3FC39A; --accent-ink:#06231A; --inc:#46CB93; --exp:#F28C74; --sav:#82B2F4; --debt:#E8B65E;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#151F1A; --surface2:#1B2721; --ink:#E6EFE9; --muted:#96A79F; --line:#293731;
  --accent:#3FC39A; --accent-ink:#06231A; --inc:#46CB93; --exp:#F28C74; --sav:#82B2F4; --debt:#E8B65E;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.main{min-width:0;width:100%;max-width:1000px;margin:0 auto;
  padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;gap:2px;
  background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;border-radius:10px;
  padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:500}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn[aria-current="page"]{color:var(--accent);font-weight:600}
.nav-btn[aria-current="page"] svg{stroke-width:2.2}

@media (min-width:860px){
  .app{grid-template-columns:230px 1fr}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;height:100vh;
    padding:24px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line)}
  .side .nav-btn{flex:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:15px;justify-content:flex-start}
  .side .nav-btn[aria-current="page"]{background:var(--surface)}
  .bottom{display:none}
  .main{padding-block:28px 48px}
  .brand-top{display:none}
}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px;padding:0 12px 14px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"S/";position:absolute;inset:0;display:grid;place-items:center;color:var(--accent-ink);font:700 11px var(--f-display);font-style:normal}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-size:26px;font-weight:700}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner b{font-weight:600}

.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.monthbar .label{font-family:var(--f-display);font-weight:600;font-size:17px;min-width:9.5em;text-align:center}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;font-size:18px;line-height:1}

.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.two{grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:17px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font:500 13px var(--f-body);color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:700;overflow-wrap:anywhere}
.stat .h{font-size:12.5px;color:var(--muted)}
.stat.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat.hero .k,.stat.hero .h{color:inherit;opacity:.85}
.c-inc{color:var(--inc)}.c-exp{color:var(--exp)}.c-sav{color:var(--sav)}.c-debt{color:var(--debt)}

.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:currentColor;vertical-align:-1px}
.legend .li{color:var(--inc)}.legend .le{color:var(--exp)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 11px var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .bi{fill:var(--inc)}.chart .be{fill:var(--exp)}
.chart .sel{fill:var(--ink);font-weight:700}

.bars{display:flex;flex-direction:column;gap:12px}
.bar-row .hd{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.bar-row .hd span:last-child{color:var(--muted);text-align:right}
.track{height:9px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--accent)}
.fill.warn{background:var(--debt)}.fill.bad{background:var(--exp)}.fill.sav{background:var(--sav)}.fill.dbt{background:var(--debt)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:20px;border:1px solid currentColor;margin-left:6px;vertical-align:1px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:14px 2px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:12px 14px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row .t{min-width:0}
.row .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .t small{color:var(--muted);font-size:13px}
.row .a{font-weight:600;white-space:nowrap;font-family:var(--f-display);font-size:16px}

.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--exp);border:1px solid var(--exp)}
.btn.sm{padding:6px 12px;font-size:14px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;
  border-radius:28px;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
@media (min-width:860px){.fab{bottom:28px}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.item h3{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.item .meta{color:var(--muted);font-size:13.5px;margin:2px 0 12px}
.item .figs{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin:8px 0 12px}
.item .figs b{font-family:var(--f-display);font-size:17px}

.bud{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .tr{grid-column:1/-1}
.bud label{font-weight:600}
.bud small{color:var(--muted);display:block;font-weight:400}
.bud input{width:7.5em;text-align:right}

input,select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--muted)}
label.f>*:not(span){color:var(--ink);font-weight:400}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:8px 2px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input:checked+label{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible+label{outline:2px solid var(--accent)}
.seg div{position:relative}

.overlay{position:fixed;inset:0;z-index:40;background:rgba(8,14,11,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet h2{font-size:20px;margin-bottom:14px}
.sheet .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sheet .foot .grow{flex:1}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.help{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
.help summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
.help summary::-webkit-details-marker{display:none}
.help summary::before{content:"?";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px}
.help ul{margin:0;padding:0 14px 12px 34px;color:var(--muted);font-size:14px}
.help li+li{margin-top:4px}
.tour-n{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px}
.tour p{font-size:15.5px;margin:0 0 10px}
.dots{display:flex;gap:6px;margin:14px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <header class="top">
      <h1 id="title">Resumen</h1>
      <div style="display:flex;gap:8px"><button class="icon-btn" data-a="tour" aria-label="Ver el tutorial" style="font-weight:700;font-family:var(--f-display);font-size:18px">?</button><button class="icon-btn" data-a="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button></div>
    </header>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
  <nav class="bottom" id="bottom" aria-label="Secciones"></nav>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var KEY='plataclara.v1';
var CATS=['Alimentación','Movilidad','Estudios','Hogar','Salud','Ocio','Personal','Trabajo','Otro'];
var TYPES=['Ingreso','Gasto','Ahorro','Deuda'];
var TYPE_LABEL={Ingreso:'Ingreso',Gasto:'Gasto',Ahorro:'Ahorro',Deuda:'Pago de deuda'};
var TYPE_CLASS={Ingreso:'c-inc',Gasto:'c-exp',Ahorro:'c-sav',Deuda:'c-debt'};
var NAV=[
 ['resumen','Resumen','<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'],
 ['movimientos','Movimientos','<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'],
 ['presupuesto','Presupuesto','<circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/>'],
 ['metas','Ahorro y metas','<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>'],
 ['deudas','Deudas','<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>']
];
var TITLES={resumen:'Resumen',movimientos:'Movimientos',presupuesto:'Presupuesto mensual',metas:'Ahorro y metas',deudas:'Deudas'};
/* Tutorial de bienvenida y ayuda por sección */
var TOUR=[
 {v:'resumen',t:'Bienvenido a Plata Clara',p:'Aquí anotas lo que ganas y lo que gastas, y la app te muestra cuánto te queda. Este recorrido dura un minuto. Los datos que ves ahora son de ejemplo, para que pruebes sin miedo.'},
 {v:'movimientos',t:'Anota un movimiento',p:'Pulsa “+ Nuevo” y elige el tipo: Ingreso (dinero que entra), Gasto (dinero que sale), Ahorro (dinero que apartas) o Deuda (pago de una cuota). Escribe el monto, la fecha y guarda.',n:'Para corregir algo, toca el movimiento en la lista: puedes editarlo o eliminarlo.'},
 {v:'resumen',t:'Mira tu resumen',p:'Disponible es lo que te queda del mes: ingresos menos gastos, ahorro y pagos de deuda. Cambia de mes con las flechas. El gráfico compara tus últimos 6 meses.'},
 {v:'presupuesto',t:'Ponle límite a tus gastos',p:'En Presupuesto escribe cuánto quieres gastar al mes en cada categoría, por ejemplo Alimentación. La barra se pone ámbar cuando te acercas al límite y dice “Excedido” si te pasas.'},
 {v:'metas',t:'Ahorra para una meta',p:'Crea una meta con su monto y fecha, y pulsa “Aportar” cada vez que guardes dinero. Si ya tenías dinero ahorrado antes de usar la app, elige “Ya lo tenía ahorrado” para que no reste de tu Disponible de este mes.'},
 {v:'deudas',t:'Controla tus deudas',p:'Registra cada deuda con su monto total y su cuota mensual. Cada vez que pagues, pulsa “Registrar pago”: verás cuánto falta y cuántas cuotas quedan.'},
 {v:'resumen',t:'Tus datos',p:'Todo se guarda en este dispositivo y en este navegador. Si cambias de celular o borras los datos del navegador, se pierden. Cuando quieras empezar con lo tuyo, pulsa “Empezar con mis datos”.',n:'En iPhone: abre la app en Safari, toca Compartir y elige “Agregar a pantalla de inicio”. Puedes volver a ver este recorrido con el botón ? de arriba.'}
];
var HELP={
 resumen:['Disponible = ingresos − gastos − ahorro − pagos de deuda del mes.','Cambia de mes con las flechas de arriba.','Toca “+ Nuevo” para registrar un movimiento desde aquí.'],
 movimientos:['Toca “+ Nuevo” para anotar un ingreso, gasto, ahorro o pago de deuda.','Toca un movimiento de la lista para editarlo o eliminarlo.','Usa los botones de arriba para ver solo un tipo de movimiento.'],
 presupuesto:['Escribe un límite en cada categoría y se guarda solo.','Déjalo vacío si no quieres limitar esa categoría.','El límite vale para todos los meses; el gasto que ves es el del mes elegido.'],
 metas:['“Nueva meta”: ponle nombre, monto y fecha.','“Aportar” suma dinero a la meta y lo anota como movimiento de ahorro.','“Ya tengo ahorrado” es para lo que tenías antes de usar la app.'],
 deudas:['“Nueva deuda”: escribe el total, lo que ya pagaste y la cuota mensual.','“Registrar pago” suma a lo pagado y lo anota como movimiento.','Cuando una deuda llega a cero aparece como Pagada.']
};
function helpHTML(v){return '<details class="help"><summary>¿Cómo funciona esta sección?</summary><ul>'+HELP[v].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul></details>';}

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0;}
function money(n){return S.cur+' '+Number(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function monthLabel(k){var p=k.split('-');return cap(new Date(+p[0],+p[1]-1,1).toLocaleDateString('es-PE',{month:'long',year:'numeric'}));}
function monthShort(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('es-PE',{month:'short'}).replace('.','');}
function dayLabel(s){var p=s.split('-');return cap(new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}));}
function shiftMonth(k,d){var p=k.split('-');var x=new Date(+p[0],+p[1]-1+d,1);return x.getFullYear()+'-'+pad(x.getMonth()+1);}
function monthsBack(k,n){var o=[];for(var i=n-1;i>=0;i--)o.push(shiftMonth(k,-i));return o;}
function daysUntil(s){if(!s)return null;var p=s.split('-');var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(+p[0],+p[1]-1,+p[2])-t)/86400000);}

/* ---------- datos de ejemplo (basados en una hoja de control diario, sin datos personales) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedData(){
  var now=new Date(),today=iso(now),r=rng(7),moves=[];
  function add(date,type,cat,desc,amt,extra){if(date>today)return;var m={id:uid()+moves.length,date:date,type:type,cat:cat,desc:desc,amount:amt,note:''};if(extra)for(var k in extra)m[k]=extra[k];moves.push(m);}
  var months=monthsBack(iso(now).slice(0,7),6);
  months.forEach(function(mk){
    var p=mk.split('-'),y=+p[0],mo=+p[1],dim=new Date(y,mo,0).getDate();
    [3,10,17,24].forEach(function(d){add(mk+'-'+pad(d),'Ingreso','Trabajo','Pago semanal',150);});
    add(mk+'-12','Ingreso','Estudios','Aporte para la mensualidad',650);
    add(mk+'-12','Gasto','Estudios','Mensualidad del instituto',595);
    add(mk+'-14','Ahorro','','Ahorro del mes',60,{goalId:'g1'});
    add(mk+'-14','Ahorro','','Ahorro del mes',40,{goalId:'g2'});
    add(mk+'-20','Deuda','','Cuota de tarjeta',80,{debtId:'d1'});
    for(var d=1;d<=dim;d++){
      var ds=mk+'-'+pad(d);
      if(r()<.55)add(ds,'Gasto','Alimentación','Desayuno',Math.round((7+r()*5)*10)/10);
      if(r()<.35)add(ds,'Gasto','Movilidad','Pasajes',12);
      if(r()<.12)add(ds,'Gasto','Alimentación','Gaseosa 2.25 L',9);
      if(r()<.08)add(ds,'Gasto','Personal','Yogurt',3.3);
      if(r()<.06)add(ds,'Gasto','Ocio','Salida con amigos',20+Math.round(r()*25));
    }
  });
  var y=now.getFullYear();
  return {cur:'S/',demo:true,moves:moves,
    budgets:{'Alimentación':200,'Movilidad':100,'Estudios':650,'Ocio':60,'Personal':50},
    goals:[{id:'g1',name:'Fondo de emergencia',target:600,initial:0,date:y+'-12-31'},{id:'g2',name:'Laptop nueva',target:2500,initial:0,date:(y+1)+'-06-30'}],
    debts:[{id:'d1',name:'Tarjeta de crédito',total:800,initial:0,monthly:80,day:20},{id:'d2',name:'Préstamo personal',total:1200,initial:300,monthly:100,day:5}]};
}
function emptyData(cur){return {cur:cur||'S/',demo:false,moves:[],budgets:{},goals:[],debts:[]};}

var mem=null;
function load(){try{var s=localStorage.getItem(KEY);if(s){var d=JSON.parse(s);if(d&&d.moves)return d;}}catch(e){}return mem;}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load()||seedData();
var ui={view:'resumen',month:iso(new Date()).slice(0,7),filter:'Todos',sheet:S.seen?null:{kind:'tour',step:0,noFocus:true}};
if(location.hash){var h=location.hash.slice(1);if(TITLES[h])ui.view=h;}

/* ---------- cálculos ---------- */
function inMonth(m,k){return m.date.slice(0,7)===k;}
/* Con mes (k) se ignora el ahorro que ya tenía la persona (prior); sin mes (null) se cuenta todo. */
function sum(k,type){return S.moves.reduce(function(a,m){return a+(m.type===type&&(k==null||inMonth(m,k))&&!(m.prior&&k!=null)?m.amount:0);},0);}
function spentByCat(k){var o={};S.moves.forEach(function(m){if(m.type==='Gasto'&&inMonth(m,k))o[m.cat]=(o[m.cat]||0)+m.amount;});return o;}
function goalSaved(g){return g.initial+S.moves.reduce(function(a,m){return a+(m.goalId===g.id?m.amount:0);},0);}
function debtPaid(d){return d.initial+S.moves.reduce(function(a,m){return a+(m.debtId===d.id?m.amount:0);},0);}
function niceMax(v){if(v<=0)return 100;var e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;var n=f<=1?1:f<=2?2:f<=4?4:f<=8?8:10;return n*e;}

/* ---------- vistas ---------- */
function statTile(k,v,h,cls,hero){return '<div class="card stat'+(hero?' hero':'')+'"><span class="k">'+k+'</span><span class="v num '+(cls||'')+'">'+v+'</span><span class="h">'+h+'</span></div>';}

function chart(){
  var ms=monthsBack(ui.month,6),W=640,H=230,L=48,R=6,T=12,B=30,pw=W-L-R,ph=H-T-B;
  var data=ms.map(function(k){return {k:k,i:sum(k,'Ingreso'),e:sum(k,'Gasto')};});
  var mx=niceMax(Math.max.apply(null,data.map(function(d){return Math.max(d.i,d.e);})));
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos y gastos de los últimos 6 meses">';
  for(var t=0;t<=4;t++){var y=T+ph-ph*t/4;s+='<line class="grid-l" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(mx*t/4).toLocaleString('es-PE')+'</text>';}
  var gw=pw/6,bw=gw*.27;
  data.forEach(function(d,i){
    var cx=L+gw*i+gw/2,hi=d.i/mx*ph,he=d.e/mx*ph;
    s+='<rect class="bi" x="'+(cx-bw-2)+'" y="'+(T+ph-hi)+'" width="'+bw+'" height="'+Math.max(hi,0)+'" rx="3"><title>Ingresos '+monthShort(d.k)+': '+money(d.i)+'</title></rect>';
    s+='<rect class="be" x="'+(cx+2)+'" y="'+(T+ph-he)+'" width="'+bw+'" height="'+Math.max(he,0)+'" rx="3"><title>Gastos '+monthShort(d.k)+': '+money(d.e)+'</title></rect>';
    s+='<text class="'+(d.k===ui.month?'sel':'')+'" x="'+cx+'" y="'+(H-9)+'" text-anchor="middle">'+monthShort(d.k)+'</text>';
  });
  return s+'</svg>';
}

function budgetRows(k,onlyBudgeted){
  var sp=spentByCat(k),out='';
  CATS.forEach(function(c){
    var lim=S.budgets[c];if(onlyBudgeted&&!lim)return;
    var used=sp[c]||0,pct=lim?used/lim*100:0,cls=pct>=100?'bad':pct>=80?'warn':'';
    out+='<div class="bar-row"><div class="hd"><span>'+c+(pct>=100?'<span class="tag c-exp">Excedido</span>':pct>=80?'<span class="tag c-debt">Cerca del límite</span>':'')+'</span><span class="num">'+money(used)+' de '+money(lim)+'</span></div><div class="track"><div class="fill '+cls+'" style="width:'+Math.min(pct,100)+'%"></div></div></div>';
  });
  return out;
}

function vResumen(){
  var k=ui.month,inc=sum(k,'Ingreso'),gas=sum(k,'Gasto'),ah=sum(k,'Ahorro'),de=sum(k,'Deuda'),libre=inc-gas-ah-de;
  var h=monthBar();
  h+='<div class="grid stats">'
    +statTile('Disponible',money(libre),'Después de gastos, ahorro y deudas',libre<0?'c-exp':'',true)
    +statTile('Ingresos',money(inc),'Lo que entró este mes','c-inc')
    +statTile('Gastos',money(gas),inc?Math.round(gas/inc*100)+'% de tus ingresos':'Sin ingresos aún','c-exp')
    +statTile('Ahorrado este mes',money(ah),'Total acumulado: '+money(sum(null,'Ahorro')),'c-sav')+'</div>';
  h+='<div class="grid two" style="margin-top:12px"><section class="card"><h2>Ingresos y gastos <small>últimos 6 meses</small></h2><div class="legend"><span class="li">Ingresos</span><span class="le">Gastos</span></div>'+chart()+'</section>';
  var sp=spentByCat(k),cats=Object.keys(sp).sort(function(a,b){return sp[b]-sp[a];}),top=cats.length?sp[cats[0]]:1;
  h+='<section class="card"><h2>Gasto por categoría <small>'+monthLabel(k)+'</small></h2>';
  if(!cats.length)h+='<p class="empty">Aún no hay gastos este mes.</p>';
  else{h+='<div class="bars">';cats.forEach(function(c){h+='<div class="bar-row"><div class="hd"><span>'+c+'</span><span class="num">'+money(sp[c])+' · '+Math.round(sp[c]/gas*100)+'%</span></div><div class="track"><div class="fill" style="width:'+(sp[c]/top*100)+'%"></div></div></div>';});h+='</div>';}
  h+='</section></div>';
  var hasB=CATS.some(function(c){return S.budgets[c];});
  h+='<div class="grid two" style="margin-top:12px"><section class="card"><h2>Presupuesto <small>'+monthLabel(k)+'</small></h2>'
    +(hasB?'<div class="bars">'+budgetRows(k,true)+'</div>':'<p class="empty">Define límites por categoría en la sección Presupuesto.</p>')+'</section>';
  var recent=S.moves.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,5);
  h+='<section class="card"><h2>Últimos movimientos</h2>'+(recent.length?'<div class="list" style="border:0;border-radius:0">'+recent.map(moveRow).join('')+'</div>':'<p class="empty">Registra tu primer movimiento con el botón “Nuevo”.</p>')+'</section></div>';
  return h;
}
function monthBar(){return '<div class="monthbar"><button class="step" data-a="mprev" aria-label="Mes anterior">‹</button><div class="label" aria-live="polite">'+monthLabel(ui.month)+'</div><button class="step" data-a="mnext" aria-label="Mes siguiente">›</button></div>';}

function moveRow(m){
  var sign=m.type==='Ingreso'?'+':m.type==='Gasto'?'−':'';
  var sub=m.type==='Ahorro'||m.type==='Deuda'?TYPE_LABEL[m.type]:m.cat;
  if(m.goalId){var g=S.goals.filter(function(x){return x.id===m.goalId;})[0];if(g)sub+=' · '+g.name;}
  if(m.prior)sub+=' · Ya lo tenía ahorrado';
  if(m.debtId){var d=S.debts.filter(function(x){return x.id===m.debtId;})[0];if(d)sub+=' · '+d.name;}
  return '<button class="row" data-a="edit" data-id="'+m.id+'"><span class="t"><b>'+esc(m.desc||TYPE_LABEL[m.type])+'</b><small>'+esc(sub)+(m.note?' · '+esc(m.note):'')+'</small></span><span class="a num '+TYPE_CLASS[m.type]+'">'+sign+money(m.amount)+'</span></button>';
}
function vMovs(){
  var h=monthBar()+'<div class="chips" role="group" aria-label="Filtrar por tipo">';
  ['Todos'].concat(TYPES).forEach(function(t){h+='<button class="chip" data-a="filter" data-v="'+t+'" aria-pressed="'+(ui.filter===t)+'">'+(t==='Deuda'?'Deudas':t==='Todos'?'Todos':t+'s')+'</button>';});
  h+='</div>';
  var list=S.moves.filter(function(m){return inMonth(m,ui.month)&&(ui.filter==='Todos'||m.type===ui.filter);}).sort(function(a,b){return b.date.localeCompare(a.date);});
  if(!list.length)return h+'<div class="card"><p class="empty">No hay movimientos con este filtro. Usa “Nuevo” para registrar uno.</p></div>';
  var day='',open=false;
  list.forEach(function(m){if(m.date!==day){if(open)h+='</div>';day=m.date;h+='<div class="day">'+dayLabel(day)+'</div><div class="list">';open=true;}h+=moveRow(m);});
  return h+'</div>';
}
function vPresu(){
  var k=ui.month,sp=spentByCat(k),tl=0,ts=0;
  CATS.forEach(function(c){if(S.budgets[c]){tl+=S.budgets[c];ts+=sp[c]||0;}});
  var h=monthBar()+'<div class="grid stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'
   +statTile('Presupuestado',money(tl),'Suma de tus límites')
   +statTile('Gastado',money(ts),'En categorías con límite','c-exp')
   +statTile(ts>tl?'Te pasaste':'Te queda',money(Math.abs(tl-ts)),tl?Math.round(ts/tl*100)+'% usado':'Aún sin límites',ts>tl?'c-exp':'c-inc')+'</div>';
  h+='<section class="card" style="margin-top:12px"><h2>Límite por categoría <small>se aplica a todos los meses</small></h2>';
  CATS.forEach(function(c){
    var lim=S.budgets[c]||0,used=sp[c]||0,pct=lim?used/lim*100:0,cls=pct>=100?'bad':pct>=80?'warn':'';
    h+='<div class="bud"><label for="b-'+c+'">'+c+'<small class="num">Gastado: '+money(used)+(lim&&pct>=100?' · Excedido':'')+'</small></label><input id="b-'+c+'" data-budget="'+c+'" inputmode="decimal" placeholder="Sin límite" value="'+(lim||'')+'" aria-label="Límite mensual para '+c+'">'
      +(lim?'<div class="tr"><div class="track"><div class="fill '+cls+'" style="width:'+Math.min(pct,100)+'%"></div></div></div>':'')+'</div>';
  });
  return h+'</section>';
}
function vMetas(){
  var tot=sum(null,'Ahorro');
  var h='<div class="toolbar"><div><span class="stat"><span class="k">Total ahorrado</span><span class="v num c-sav" style="font-size:28px">'+money(tot)+'</span></span></div><button class="btn alt" data-a="goal-new">Nueva meta</button></div>';
  if(!S.goals.length)return h+'<div class="card"><p class="empty">Crea una meta (viaje, fondo de emergencia, compra) y ve cuánto te falta.</p></div>';
  h+='<div class="cards">';
  S.goals.forEach(function(g){
    var sv=goalSaved(g),pct=Math.min(100,g.target?sv/g.target*100:0),dl=daysUntil(g.date);
    h+='<article class="card item"><h3>'+esc(g.name)+'</h3><p class="meta">'+(g.date?'Para el '+dayLabel(g.date).replace(/^[^,]*, /,'')+(dl!=null?' · '+(dl<0?'venció hace '+(-dl)+' días':dl+' días'):''):'Sin fecha')+'</p>'
     +'<div class="track"><div class="fill sav" style="width:'+pct+'%"></div></div><div class="figs"><span>Ahorrado<br><b class="num c-sav">'+money(sv)+'</b></span><span style="text-align:right">Meta<br><b class="num">'+money(g.target)+'</b></span></div>'
     +'<div class="actions"><button class="btn sm" data-a="contrib" data-id="'+g.id+'">Aportar</button><button class="btn sm alt" data-a="goal-edit" data-id="'+g.id+'">Editar</button><span class="num" style="align-self:center;color:var(--muted);font-size:13px">'+Math.round(pct)+'%</span></div></article>';
  });
  return h+'</div>';
}
function vDeudas(){
  var rem=0;S.debts.forEach(function(d){rem+=Math.max(0,d.total-debtPaid(d));});
  var h='<div class="toolbar"><div><span class="stat"><span class="k">Por pagar</span><span class="v num c-debt" style="font-size:28px">'+money(rem)+'</span></span></div><button class="btn alt" data-a="debt-new">Nueva deuda</button></div>';
  if(!S.debts.length)return h+'<div class="card"><p class="empty">Registra tus deudas para ver cuánto falta y no olvidar las cuotas.</p></div>';
  h+='<div class="cards">';
  S.debts.forEach(function(d){
    var paid=debtPaid(d),left=Math.max(0,d.total-paid),pct=Math.min(100,d.total?paid/d.total*100:0);
    var months=d.monthly?Math.ceil(left/d.monthly):null;
    h+='<article class="card item"><h3>'+esc(d.name)+(left===0?'<span class="tag c-inc">Pagada</span>':'')+'</h3><p class="meta">'+(d.monthly?'Cuota de '+money(d.monthly)+(d.day?' · día '+d.day+' de cada mes':''):'Sin cuota fija')+(months&&left?' · faltan ~'+months+' cuotas':'')+'</p>'
     +'<div class="track"><div class="fill dbt" style="width:'+pct+'%"></div></div><div class="figs"><span>Pagado<br><b class="num">'+money(paid)+'</b></span><span style="text-align:right">Falta<br><b class="num c-debt">'+money(left)+'</b></span></div>'
     +'<div class="actions"><button class="btn sm" data-a="pay" data-id="'+d.id+'"'+(left===0?' disabled':'')+'>Registrar pago</button><button class="btn sm alt" data-a="debt-edit" data-id="'+d.id+'">Editar</button></div></article>';
  });
  return h+'</div>';
}

/* ---------- hojas (formularios) ---------- */
function opts(list,sel,blank){return (blank?'<option value="">'+blank+'</option>':'')+list.map(function(o){var v=typeof o==='string'?o:o.id,l=typeof o==='string'?o:o.name;return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(l)+'</option>';}).join('');}
function moveFields(type,m){
  m=m||{};
  if(type==='Ahorro')return '<label class="f full"><span>¿De dónde viene este ahorro?</span><select id="f-origin" name="origin"><option value="">De mis ingresos de este mes</option><option value="prior"'+(m.prior?' selected':'')+'>Ya lo tenía ahorrado (no afecta este mes)</option></select></label>'
    +'<label class="f full"><span>Meta (opcional)</span><select id="f-goal" name="goalId">'+opts(S.goals,m.goalId,'Ahorro general')+'</select></label>';
  if(type==='Deuda')return '<label class="f full"><span>Deuda</span><select id="f-debt" name="debtId">'+opts(S.debts,m.debtId,'Otra deuda')+'</select></label>';
  return '<label class="f full"><span>Categoría</span><select id="f-cat" name="cat">'+opts(CATS,m.cat||'Alimentación')+'</select></label>';
}

      +'<div class="fgrid" style="margin-top:14px"><label class="f"><span>Monto ('+esc(S.cur)+')</span><input id="f-amt" name="amount" inputmode="decimal" required placeholder="0.00" value="'+(m.amount!=null?m.amount:'')+'"></label>'

  }else if(s.kind==='debt'){

  }else if(s.kind==='quick'){

  }else if(s.kind==='tour'){

    h='<div class="tour"><div class="tour-n">Paso '+(s.step+1)+' de '+TOUR.length+'</div><h2>'+T.t+'</h2><p>'+T.p+'</p>'+(T.n?'<p class="note">'+T.n+'</p>':'')
      +'<div class="dots" aria-hidden="true">'+TOUR.map(function(x,i){return '<i class="'+(i===s.step?'on':'')+'"></i>';}).join('')+'</div>'
      +'<div class="foot">'+(s.step>0?'<button class="btn alt" data-a="tour-prev">Anterior</button>':'<button class="btn alt" data-a="close">Saltar</button>')
      +'<button class="btn grow" data-a="'+(last?'close':'tour-next')+'">'+(last?'Empezar':'Siguiente')+'</button></div></div>';
  }else if(s.kind==='settings'){
    h='<h2>Ajustes</h2><div class="fgrid"><label class="f full"><span>Moneda</span><select id="s-cur" data-a-change="cur">'+['S/','$','€','US$'].map(function(c){return '<option'+(c===S.cur?' selected':'')+'>'+c+'</option>';}).join('')+'</select></label></div>'
      +'<div class="foot"><button class="btn alt" data-a="tour">Ver el tutorial</button><button class="btn alt" data-a="loaddemo">Cargar datos de ejemplo</button><button class="btn danger" data-a="clearall">Borrar todo y empezar</button></div>'
      +'<p class="note">En esta versión de prueba tus datos se guardan solo en este dispositivo y navegador.</p><div class="foot"><button class="btn grow" data-a="close">Listo</button></div>';
  }
  return '<div class="overlay" data-a="overlay"><div class="sheet" role="dialog" aria-modal="true">'+h+'</div></div>';
}

/* ---------- render ---------- */
function render(){
  var nav=NAV.map(function(n){return '<button class="nav-btn" data-a="nav" data-v="'+n[0]+'"'+(ui.view===n[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+n[2]+'</svg><span>'+n[1]+'</span></button>';}).join('');
  document.getElementById('side').innerHTML='<div class="brand"><i></i>Plata Clara</div>'+nav;
  document.getElementById('bottom').innerHTML=nav;
  document.getElementById('title').textContent=TITLES[ui.view];
  document.getElementById('banner').innerHTML=S.demo?'<div class="banner"><span><b>Estás viendo datos de ejemplo.</b> Pruébalos y, cuando quieras, empieza con los tuyos.</span><button class="btn sm" data-a="clearall">Empezar con mis datos</button></div>':'';
  var v=helpHTML(ui.view)+{resumen:vResumen,movimientos:vMovs,presupuesto:vPresu,metas:vMetas,deudas:vDeudas}[ui.view]();
  if(ui.view==='movimientos'||ui.view==='resumen')v+='<button class="btn fab" data-a="new">+ Nuevo</button>';
  document.getElementById('view').innerHTML=v;
  var sh=document.getElementById('sheet');
  if(ui.sheet){sh.innerHTML=sheetHTML();var f=sh.querySelector('input:not([type=radio]),select');if(f&&!ui.sheet.noFocus)f.focus();}else sh.innerHTML='';
}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on');},2000);}
function closeSheet(){if(ui.sheet&&ui.sheet.kind==='tour'){if(!S.seen){S.seen=true;save();}ui.view='resumen';}ui.sheet=null;render();}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=el.dataset.id;
  if(a==='overlay'){if(e.target===el)closeSheet();return;}
  if(a==='nav'){ui.view=el.dataset.v;try{history.replaceState(null,'','#'+ui.view);}catch(x){}render();window.scrollTo(0,0);}
  else if(a==='mprev'){ui.month=shiftMonth(ui.month,-1);render();}
  else if(a==='mnext'){ui.month=shiftMonth(ui.month,1);render();}
  else if(a==='filter'){ui.filter=el.dataset.v;render();}
  else if(a==='new'){ui.sheet={kind:'move'};render();}
  else if(a==='edit'){ui.sheet={kind:'move',id:id};render();}
  else if(a==='goal-new'){ui.sheet={kind:'goal'};render();}
  else if(a==='goal-edit'){ui.sheet={kind:'goal',id:id};render();}
  else if(a==='debt-new'){ui.sheet={kind:'debt'};render();}
  else if(a==='debt-edit'){ui.sheet={kind:'debt',id:id};render();}
  else if(a==='contrib'){ui.sheet={kind:'quick',of:'goal',id:id};render();}
  else if(a==='pay'){ui.sheet={kind:'quick',of:'debt',id:id};render();}
  else if(a==='settings'){ui.sheet={kind:'settings'};render();}
  else if(a==='tour-next'||a==='tour-prev'){var st=ui.sheet.step+(a==='tour-next'?1:-1);ui.sheet={kind:'tour',step:st,noFocus:true};ui.view=TOUR[st].v;render();}
  else if(a==='tour'){ui.sheet={kind:'tour',step:0,noFocus:true};ui.view=TOUR[0].v;render();}
  else if(a==='close'){closeSheet();}
  else if(a==='del'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent='Toca otra vez para eliminar';return;}
    var s=ui.sheet;
    if(s.kind==='move')S.moves=S.moves.filter(function(m){return m.id!==s.id;});
    if(s.kind==='goal'){S.goals=S.goals.filter(function(g){return g.id!==s.id;});S.moves.forEach(function(m){if(m.goalId===s.id)delete m.goalId;});}
    if(s.kind==='debt'){S.debts=S.debts.filter(function(d){return d.id!==s.id;});S.moves.forEach(function(m){if(m.debtId===s.id)delete m.debtId;});}
    save();closeSheet();toast('Eliminado');
  }
  else if(a==='loaddemo'){S=seedData();S.seen=true;save();ui.sheet=null;render();toast('Datos de ejemplo cargados');}
  else if(a==='clearall'){var c=S.cur;S=emptyData(c);S.seen=true;save();ui.sheet=null;render();toast('Listo, empieza desde cero');}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.name==='type'&&ui.sheet&&ui.sheet.kind==='move'){document.getElementById('dyn').innerHTML=moveFields(t.value,{});return;}
  if(t.dataset.budget){var v=num(t.value);if(v>0)S.budgets[t.dataset.budget]=v;else delete S.budgets[t.dataset.budget];save();render();return;}
  if(t.id==='s-cur'){S.cur=t.value;save();return;}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target,k=f.dataset.kind,d=Object.fromEntries(new FormData(f).entries()),s=ui.sheet;
  if(k==='move'){
    var amt=num(d.amount);if(amt<=0){toast('Escribe un monto mayor que cero');return;}
    var rec={id:s.id||uid(),date:d.date,type:d.type,desc:(d.desc||'').trim(),amount:Math.round(amt*100)/100,note:(d.note||'').trim(),cat:d.type==='Gasto'||d.type==='Ingreso'?(d.cat||'Otro'):''};
    if(d.type==='Ahorro'&&d.goalId)rec.goalId=d.goalId;
    if(d.type==='Ahorro'&&d.origin==='prior')rec.prior=true;
    if(d.type==='Deuda'&&d.debtId)rec.debtId=d.debtId;
    if(s.id)S.moves=S.moves.map(function(m){return m.id===s.id?rec:m;});else S.moves.push(rec);
    ui.month=rec.date.slice(0,7);toast('Movimiento guardado');
  }else if(k==='goal'){
    var gr={id:s.id||uid(),name:d.name.trim(),target:num(d.target),initial:num(d.initial),date:d.date||''};
    if(gr.target<=0){toast('El monto objetivo debe ser mayor que cero');return;}
    if(s.id)S.goals=S.goals.map(function(g){return g.id===s.id?gr:g;});else S.goals.push(gr);toast('Meta guardada');
  }else if(k==='debt'){
    var dr={id:s.id||uid(),name:d.name.trim(),total:num(d.total),initial:num(d.initial),monthly:num(d.monthly),day:Math.min(31,Math.max(0,Math.round(num(d.day))))||0};
    if(dr.total<=0){toast('El monto total debe ser mayor que cero');return;}
    if(s.id)S.debts=S.debts.map(function(x){return x.id===s.id?dr:x;});else S.debts.push(dr);toast('Deuda guardada');
  }else if(k==='quick'){
    var q=num(d.amount);if(q<=0){toast('Escribe un monto mayor que cero');return;}
    var isG=s.of==='goal',ent=(isG?S.goals:S.debts).filter(function(x){return x.id===s.id;})[0];
    var mv={id:uid(),date:d.date,type:isG?'Ahorro':'Deuda',cat:'',desc:isG?'Aporte a '+ent.name:'Pago de '+ent.name,amount:Math.round(q*100)/100,note:''};
    if(isG)mv.goalId=ent.id;else mv.debtId=ent.id;
    if(isG&&d.origin==='prior')mv.prior=true;S.moves.push(mv);toast(isG?'Aporte registrado':'Pago registrado');
  }
  save();ui.sheet=null;render();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet();});
render();
})();
</script>
</body>
</html>

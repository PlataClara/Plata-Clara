document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=el.dataset.id;
  if(a==='overlay'){if(e.target===el)closeSheet();return;}
  if(a==='nav'){ui.view=el.dataset.v;try{history.replaceState(null,'','#'+ui.view);}catch(x){}render();window.scrollTo(0,0);}
  else if(a==='menu'){var mn=document.getElementById('menu');mn.hidden=!mn.hidden;el.setAttribute('aria-expanded',String(!mn.hidden));}
  else if(a==='mprev'){ui.month=shiftMonth(ui.month,-1);render();}
  else if(a==='mnext'){ui.month=shiftMonth(ui.month,1);render();}
  else if(a==='filter'){ui.filter=el.dataset.v;render();}
  else if(a==='new'){ui.sheet={kind:'move'};render();}
  else if(a==='edit'){ui.sheet={kind:'move',id:id};render();}
  else if(a==='goal-new'){ui.sheet={kind:'goal'};render();}
  else if(a==='admin'){ui.sheet={kind:'admin',noFocus:true};render();admLoad();}
  else if(a==='adm-go'){admGo();}
  else if(a==='adm-del'){admDel(el.dataset.email);}
  else if(a==='save-new'){ui.sheet={kind:'move',type:'Ahorro'};render();}
  else if(a==='gfilter'){ui.gfilter=el.dataset.v;render();}
  else if(a==='goal-edit'){ui.sheet={kind:'goal',id:id};render();}
  else if(a==='debt-new'){ui.sheet={kind:'debt'};render();}
  else if(a==='debt-edit'){ui.sheet={kind:'debt',id:id};render();}
  else if(a==='contrib'){ui.sheet={kind:'quick',of:'goal',id:id};render();}
  else if(a==='pay'){ui.sheet={kind:'quick',of:'debt',id:id};render();}
  else if(a==='settings'){ui.sheet={kind:'settings',noFocus:true};render();}
  else if(a==='region'){ui.sheet={kind:'region',noFocus:true};render();}
  else if(a==='cur'){setBase(el.dataset.v);}
  else if(a==='qtap'){var q=S.quicks.filter(function(x){return x.id===id;})[0];if(q){var mv={id:uid(),date:iso(new Date()),type:q.type,cat:q.cat,desc:q.name,amount:q.amount,note:'',cc:mc(q)};S.moves.push(mv);ui.month=mv.date.slice(0,7);save();render();toast(t('{name} anotado',{name:q.name}),mv.id);}}
  else if(a==='undo'){S.moves=S.moves.filter(function(m){return m.id!==id;});save();render();toast(t('Anotación deshecha'));}
  else if(a==='qedit'){ui.sheet={kind:'quicks'};render();}
  else if(a==='qdel'){S.quicks=S.quicks.filter(function(x){return x.id!==id;});save();render();}
  else if(a==='bk-down'){downloadBackup();}
  else if(a==='bk-copy'){copyBackup();}
  else if(a==='bk-paste'){var tx=document.getElementById('r-paste');parseBackup(tx?tx.value:'');}
  else if(a==='bk-confirm'){S=ui.sheet.data;LANG=S.lang;nfc={};save();ui.sheet=null;ui.view='resumen';render();toast(t('Datos restaurados'));}
  else if(a==='tour-next'||a==='tour-prev'){var st=ui.sheet.step+(a==='tour-next'?1:-1);ui.sheet={kind:'tour',step:st,noFocus:true};ui.view=tourSteps()[st].v;render();}
  else if(a==='close'){closeSheet();}
  else if(a==='del'){
    if(!el.dataset.armed){el.dataset.armed='1';el.textContent=t('Toca otra vez para eliminar');return;}
    var s=ui.sheet;
    if(s.kind==='move')S.moves=S.moves.filter(function(m){return m.id!==s.id;});
    if(s.kind==='goal'){S.goals=S.goals.filter(function(g){return g.id!==s.id;});S.moves.forEach(function(m){if(m.goalId===s.id)delete m.goalId;});}
    if(s.kind==='debt'){S.debts=S.debts.filter(function(d){return d.id!==s.id;});S.moves.forEach(function(m){if(m.debtId===s.id)delete m.debtId;});}
    save();closeSheet();toast(t('Eliminado'));
  }
  else if(a==='loaddemo'){S=seedData();S.seen=true;save();ui.sheet=null;render();toast(t('Datos de ejemplo cargados'));}
  else if(a==='clearall'){S=emptyData();save();ui.sheet=null;render();toast(t('Listo, empieza desde cero'));}
});
document.addEventListener('change',function(e){
  var tg=e.target;
  if(tg.id==='r-file'&&tg.files&&tg.files[0]){readBackup(tg.files[0]);return;}
  if(tg.id==='r-lang'){setLang(tg.value);return;}
  if(tg.id==='r-base'){setBase(tg.value);return;}
  if(tg.name==='cc'){var fm=tg.closest('form');if(fm){var al=fm.querySelector('[data-amtl]'),fn=fm.querySelector('[data-fxn]');
    if(al)al.textContent=t('Monto ({c})',{c:curSym(tg.value)});if(fn)fn.textContent=fxNote(tg.value);}return;}
  if(tg.name==='kind'){var ow=document.getElementById('g-owner-w');if(ow)ow.hidden=tg.value!=='ext';return;}
  if(tg.name==='type'&&ui.sheet&&ui.sheet.kind==='move'){document.getElementById('dyn').innerHTML=moveFields(tg.value,ui.sheet.id?{id:ui.sheet.id}:{});return;}
  if(tg.dataset.budget){var v=num(tg.value);if(v>0)S.budgets[tg.dataset.budget]=v;else delete S.budgets[tg.dataset.budget];S.seedBudgets=false;save();render();return;}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var f=e.target,k=f.dataset.kind,d=Object.fromEntries(new FormData(f).entries()),s=ui.sheet,msg='';
  if(k==='move'){
    var amt=num(d.amount);if(amt<=0){toast(t('Escribe un monto mayor que cero'));return;}
    var rec={id:s.id||uid(),date:d.date,type:d.type,desc:(d.desc||'').trim(),amount:Math.round(amt*100)/100,note:(d.note||'').trim(),cat:d.type==='Gasto'||d.type==='Ingreso'?(d.cat||'Otro'):''};
    if(d.type==='Ahorro'&&d.goalId)rec.goalId=d.goalId;
    if((d.type==='Ahorro'||d.type==='Gasto'||d.type==='Deuda')&&d.origin==='prior')rec.prior=true;
    if((d.type==='Deuda'||d.type==='Gasto')&&d.origin==='ahorro'){rec.prior=true;rec.fromSav=true;}
    if(d.type==='Deuda'&&d.debtId)rec.debtId=d.debtId;
    var prevM=s.id?S.moves.filter(function(m){return m.id===s.id;})[0]:null;
    stampFx(rec,d.cc,prevM);
    var lk=rec.goalId?S.goals.filter(function(x){return x.id===rec.goalId;})[0]:rec.debtId?S.debts.filter(function(x){return x.id===rec.debtId;})[0]:null;
    if(lk)rec.cc=mc(lk);   /* los aportes y pagos usan la moneda de su meta o deuda */
    if(s.id)S.moves=S.moves.map(function(m){return m.id===s.id?rec:m;});else S.moves.push(rec);
    if(d.asquick&&!s.id&&(d.type==='Gasto'||d.type==='Ingreso')&&rec.desc)S.quicks.push({id:uid(),name:rec.desc,type:d.type,cat:rec.cat,amount:rec.amount,cc:rec.cc});
    ui.month=rec.date.slice(0,7);msg=t(d.asquick&&!s.id?K('Movimiento y atajo guardados'):K('Movimiento guardado'));
  }else if(k==='goal'){
    var gr={id:s.id||uid(),name:d.name.trim(),target:num(d.target),initial:num(d.initial),date:d.date||'',cc:validCur(d.cc)?d.cc:S.cc,kind:d.kind==='ext'?'ext':'own',owner:d.kind==='ext'?(d.owner||'').trim().slice(0,60):''};
    if(gr.target<=0){toast(t('El monto objetivo debe ser mayor que cero'));return;}
    if(s.id)S.goals=S.goals.map(function(g){return g.id===s.id?gr:g;});else S.goals.push(gr);msg=t('Meta guardada');
  }else if(k==='debt'){
    var dr={id:s.id||uid(),name:d.name.trim(),total:num(d.total),initial:num(d.initial),monthly:num(d.monthly),day:Math.min(31,Math.max(0,Math.round(num(d.day))))||0,cc:validCur(d.cc)?d.cc:S.cc};
    if(dr.total<=0){toast(t('El monto total debe ser mayor que cero'));return;}
    if(s.id)S.debts=S.debts.map(function(x){return x.id===s.id?dr:x;});else S.debts.push(dr);msg=t('Deuda guardada');
  }else if(k==='quickadd'){
    var qa=num(d.amount);if(qa<=0){toast(t('Escribe un monto mayor que cero'));return;}
    S.quicks.push({id:uid(),name:d.name.trim(),type:d.type==='Ingreso'?'Ingreso':'Gasto',cat:CATS.indexOf(d.cat)>=0?d.cat:'Otro',amount:Math.round(qa*100)/100,cc:S.cc});
    save();ui.sheet={kind:'quicks'};render();toast(t('Atajo agregado'));return;
  }else if(k==='quick'){
    var qm=num(d.amount);if(qm<=0){toast(t('Escribe un monto mayor que cero'));return;}
    var isG=s.of==='goal',ent=(isG?S.goals:S.debts).filter(function(x){return x.id===s.id;})[0];
    var mv2={id:uid(),date:d.date,type:isG?'Ahorro':'Deuda',cat:'',desc:t(isG?K('Aporte a {name}'):K('Pago de {name}'),{name:ent.name}),amount:Math.round(qm*100)/100,note:''};
    if(isG)mv2.goalId=ent.id;else mv2.debtId=ent.id;
    if(d.origin==='prior')mv2.prior=true;
    if(!isG&&d.origin==='ahorro'){mv2.prior=true;mv2.fromSav=true;}
    stampFx(mv2,mc(ent),null);S.moves.push(mv2);msg=t(isG?K('Aporte registrado'):K('Pago registrado'));
  }
  save();ui.sheet=null;render();if(msg)toast(msg);
});
document.addEventListener('click',function(e){var mn=document.getElementById('menu');if(mn&&!mn.hidden&&!e.target.closest('#b-menu')){mn.hidden=true;document.getElementById('b-menu').setAttribute('aria-expanded','false');}});
function chime(){try{var A=window.AudioContext||window.webkitAudioContext,c=new A(),t0=c.currentTime;[[660,0],[880,.16]].forEach(function(n){var o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=n[0];g.gain.setValueAtTime(0,t0+n[1]);g.gain.linearRampToValueAtTime(.25,t0+n[1]+.02);g.gain.exponentialRampToValueAtTime(.001,t0+n[1]+.5);o.connect(g);g.connect(c.destination);o.start(t0+n[1]);o.stop(t0+n[1]+.55);});setTimeout(function(){c.close();},1500);}catch(e){}}
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',function(e){if(e.data&&e.data.type==='pc-push')chime();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet();});
window.__pc={setLang:setLang,langs:LANGS,t:t,view:function(){return ui.view;},get:function(){return S;},empty:function(){return emptyData();},apply:function(d){
  if(!d||!d.moves)return;
  S=d;LANG=validLang(S.lang)?S.lang:LANG;S.lang=LANG;
  if(!validCur(S.cc))S.cc=detectCC(LANG);
  if(!S.quicks)S.quicks=[];
  migrate(S);
  nfc={};mem=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  ui.sheet=null;render();
}};
render();
})();
